<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>원팀 졸업반 · 스터디방</title>
<meta property="og:title" content="원팀 졸업반 · 스터디방">
<meta property="og:description" content="SNS·부동산 스터디 일정, 참석 체크, 과제 올리기를 한곳에서">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F8FA; --white:#FFF; --dark:#1C2B4A;
  --acc:#1B2A4E; --acc-soft:#EEF1F7; --acc-lt:#B9C8E2;
  --pink:#D6336C; --pink-soft:#FDF1F5;
  --text:#14181F; --text-md:#5A6172; --text-lt:#6B7280; --mute:#9AA0AC;
  --border:#E6E8EE; --ok:#0F6E3A; --ok-bg:#EAF6EF; --warn:#854F0B; --warn-bg:#FBF6EC;
}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--text);line-height:1.6;background:var(--bg);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:520px;margin:0 auto;background:var(--white);min-height:100vh;padding-bottom:60px}
button,input,textarea,select{font-family:inherit}
a{color:var(--acc)}
.hd{background:var(--dark);color:#fff;padding:20px 20px 0}
.hd small{display:block;font-size:12px;color:var(--acc-lt);font-weight:600;letter-spacing:.04em}
.hd h1{font-size:21px;font-weight:800;margin-top:2px}
.tracks{display:flex;gap:4px;margin-top:14px}
.tracks a{flex:1;text-align:center;text-decoration:none;color:var(--acc-lt);font-size:14.5px;font-weight:700;padding:11px 8px 12px;border-radius:10px 10px 0 0}
.tracks a.on{background:var(--white);color:var(--acc)}
.tracks a small{display:block;font-size:11.5px;font-weight:600;color:inherit;opacity:.75;margin-top:1px}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:var(--acc-soft);font-size:13px;color:var(--text-md)}
.me b{color:var(--acc)}
.me button{border:0;background:none;color:var(--text-lt);text-decoration:underline;font-size:12.5px;cursor:pointer}
.sec{padding:22px 20px;border-bottom:8px solid var(--bg)}
.sec h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h2 .n{font-size:12px;font-weight:700;color:var(--pink);background:var(--pink-soft);border-radius:99px;padding:2px 9px}
.card{border:1px solid var(--border);border-radius:14px;padding:16px}
.when{font-size:22px;font-weight:800;color:var(--acc);letter-spacing:-.01em}
.when.vote{font-size:17px;color:var(--pink)}
.ttl{font-size:16px;font-weight:700;margin-top:4px}
.topic{font-size:14px;color:var(--text-md);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc-lt)}
.btn.pink{background:var(--pink)}
.btn.on{box-shadow:0 0 0 3px var(--acc-lt)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.btn:focus-visible,.chip:focus-visible,.tracks a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hw{white-space:pre-wrap;font-size:14px;line-height:1.75;background:var(--bg);border-radius:12px;padding:14px;margin-top:4px}
.due{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;margin-top:10px;display:inline-block;font-weight:600}
.meet{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ok-bg);font-size:14px}
.meet a{font-weight:700;color:var(--ok)}
.hint{font-size:13px;color:var(--text-lt);margin-top:8px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;background:#fff;cursor:pointer;text-align:left;width:100%}
.chip.on{border-color:var(--acc);background:var(--acc-soft)}
.chip .c{font-size:12.5px;color:var(--text-lt);font-weight:600;white-space:nowrap}
.who{font-size:13px;color:var(--text-md);margin-top:10px;line-height:1.8}
.who b{color:var(--acc)}
.login label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.login input,.login select,.edit textarea,.edit input,.adm input,.adm textarea,.adm select{width:100%;font-size:16px;border:1px solid var(--border);border-radius:10px;padding:12px 13px;background:var(--bg);outline:none}
.login .agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-md);margin-top:12px;font-weight:500}
.login .agree input{width:auto;margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:700;color:var(--text-md);cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.err{color:var(--pink);font-size:13px;margin-top:8px;font-weight:600}
.edit textarea{min-height:110px;resize:vertical;line-height:1.6}
.edit label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
.pick{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--acc-lt);border-radius:12px;padding:14px;font-size:14px;font-weight:700;color:var(--acc);cursor:pointer;margin-top:6px}
.pick input{display:none}
/* 모두의 과제 = 패들릿처럼 */
.board{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;break-inside:avoid;margin-bottom:0}
.post .h{font-size:14.5px;font-weight:800;color:#fff;background:var(--acc);padding:9px 14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.post.mine .h{background:var(--pink)}
.post .h small{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:500;white-space:nowrap}
.post .b{padding:12px 14px 14px}
.post pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7;color:var(--text)}
.post .imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.post .imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;background:var(--bg)}
.post .imgs.one{grid-template-columns:1fr}
.post .imgs.one img{aspect-ratio:auto;max-height:520px;object-fit:contain}
.post .b > .imgs:first-child{margin-top:0}
.empty{font-size:14px;color:var(--mute);text-align:center;padding:24px 0}
.past button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:none;padding:12px 2px;font-size:14px;cursor:pointer;color:var(--text)}
.past button small{color:var(--text-lt);margin-left:6px}
.past button.on{font-weight:800;color:var(--acc)}
.big{position:fixed;inset:0;background:rgba(10,14,25,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
.big img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:60}
.adm .st{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;cursor:pointer}
.adm .st b{color:var(--acc)}
.adm label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 5px;color:var(--text-md)}
.adm textarea{min-height:90px;font-size:14px}
.adm .m{font-size:13px;color:var(--text-md);display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0}
.adm .m button{border:0;background:none;color:var(--pink);font-size:12px;cursor:pointer}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px}
.tag.draft{background:#EEE;color:#555}.tag.vote{background:var(--pink-soft);color:var(--pink)}.tag.set{background:var(--ok-bg);color:var(--ok)}.tag.done{background:var(--acc-soft);color:var(--acc)}
.tag.tr{background:var(--acc-soft);color:var(--acc)}

/* 댓글·하트 */
.post .act{display:flex;gap:6px;align-items:center;margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.post .act button{border:0;background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--text-md);cursor:pointer}
.post .act button.on{background:var(--pink-soft);color:var(--pink)}
.cmts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cmt{font-size:13px;line-height:1.55;background:var(--bg);border-radius:10px;padding:7px 10px}
.cmt b{color:var(--acc);margin-right:6px}
.cmt button{border:0;background:none;color:var(--mute);font-size:11.5px;margin-left:6px;cursor:pointer}
.cin{display:flex;gap:6px;margin-top:6px}
.cin input{flex:1;min-width:0;font-size:14px;border:1px solid var(--border);border-radius:99px;padding:8px 12px;background:#fff;outline:none}
.cin button{border:0;border-radius:99px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;padding:0 14px;cursor:pointer}
/* 자료·주제·스터디장 */
.links a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:700;color:var(--acc);margin-bottom:8px}
.idea{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--border);padding:10px 0;font-size:14px}
.idea .t{flex:1;min-width:0}
.idea .t small{display:block;color:var(--mute);font-size:12px}
.idea button.v{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--text-md);cursor:pointer;white-space:nowrap}
.idea button.v.on{border-color:var(--pink);color:var(--pink);background:var(--pink-soft)}
.idea button.x{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer}
.lead{background:var(--warn-bg)}
.lead h2{color:var(--warn)}
.stat{display:grid;grid-template-columns:1fr repeat(3,52px);font-size:13px;border-bottom:1px solid var(--border);padding:6px 0;color:var(--text-md)}
.stat.hd2{font-weight:700;color:var(--text)}
.stat span:not(:first-child){text-align:center}
/* 발표 모드 */
.pres{position:fixed;inset:0;background:#0F1626;color:#fff;z-index:70;display:flex;flex-direction:column}
.pres .top2{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;font-size:14px;color:var(--acc-lt)}
.pres .top2 button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.pres .tlist{display:flex;gap:6px;overflow-x:auto;padding:0 22px 12px;flex:0 0 auto}
.pres .tlist button{flex:0 0 auto;border:1px solid rgba(255,255,255,.18);background:none;color:#C9D1E0;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.pres .tlist button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.colm > .ch .pbtn{border:0;background:#fff;color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer;margin-left:auto;margin-right:6px;font-family:inherit}
.pres .stage{flex:1;min-height:0;display:flex;gap:28px;padding:0 28px 18px;align-items:stretch}
.pres .pimgs{flex:1.4;min-width:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-content:center}
.pres .pimgs img{width:100%;max-height:72vh;object-fit:contain;border-radius:12px;background:#1B2438}
.pres .ptxt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:auto}
.pres .ptxt h3{font-size:clamp(28px,4vw,48px);font-weight:800}
.pres .ptxt pre{white-space:pre-wrap;font-family:inherit;font-size:clamp(17px,1.8vw,22px);line-height:1.7;color:#E6EAF2}
.pres .nav{display:flex;justify-content:center;gap:12px;padding:0 0 22px}
.pres .nav button{border:0;background:var(--pink);color:#fff;border-radius:12px;padding:14px 26px;font-size:17px;font-weight:800;cursor:pointer}
.pres .nav button:disabled{opacity:.35}
@media (max-width: 760px){ .pres .stage{flex-direction:column;overflow:auto} }

/* 챌린지 */
.chal{background:var(--pink-soft)}
.chal .rule{font-size:13.5px;color:var(--text-md);line-height:1.7}
.chal .today{margin-top:10px;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;color:var(--pink)}
.chal .today small{display:block;font-size:12px;color:var(--text-lt);font-weight:600}
.chal .edit input{background:#fff}
.stamps{overflow-x:auto}
.stamps table{border-collapse:collapse;font-size:13px;min-width:100%}
.stamps th,.stamps td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.stamps th:first-child,.stamps td:first-child{text-align:left;font-weight:700;color:var(--acc)}
.stamps .s{display:inline-block;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--acc-lt);margin:0 2px;vertical-align:middle;font-size:12px;line-height:19px;color:#fff}
.stamps .s.on{background:var(--pink);border:1.5px solid var(--pink)}
.ups a{display:block;text-decoration:none;color:var(--text);font-size:13.5px;border-bottom:1px solid var(--border);padding:8px 0}
.ups a b{color:var(--acc);margin-right:6px}
.ups a small{color:var(--mute);margin-left:6px}

/* 다가오는 일정 */
.up{padding:16px 20px;border-bottom:8px solid var(--bg)}
.up h2{font-size:16px;font-weight:800;margin-bottom:10px}
.up .list{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.up .ev{flex:0 0 auto;min-width:170px;max-width:240px;scroll-snap-align:start;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;text-decoration:none;color:var(--text)}
.up .ev.st{border-color:var(--acc-lt);background:var(--acc-soft)}
.up .ev.ch{border-color:#F6CFDC;background:var(--pink-soft)}
.up .ev b{display:block;font-size:14.5px;color:var(--acc)}
.up .ev.ch b{color:var(--pink)}
.up .ev span{display:block;font-size:13px;color:var(--text-md);line-height:1.45;margin-top:2px}
.up .ev small{font-size:11.5px;font-weight:700;color:var(--text-lt)}
/* 스터디 판 = 패들릿 선반 */
.shelf{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;padding-bottom:10px;scroll-snap-type:x proximity}
.topbar{overflow-x:auto;overflow-y:hidden;height:14px;margin:0 0 8px}.topbar div{height:1px}
.topbar::-webkit-scrollbar,.shelf::-webkit-scrollbar{height:12px}
.topbar::-webkit-scrollbar-thumb,.shelf::-webkit-scrollbar-thumb{background:#B9C0CC;border-radius:99px}
.topbar::-webkit-scrollbar-track,.shelf::-webkit-scrollbar-track{background:#E3E6EC;border-radius:99px}
.arrows{display:flex;gap:6px;margin-left:8px}.arrows button{border:1px solid var(--border);background:#fff;border-radius:10px;width:36px;height:32px;font-size:16px;font-weight:800;color:var(--acc);cursor:pointer}
.arrows button:hover{background:var(--pink-soft)}
.colm{flex:0 0 86%;max-width:340px;scroll-snap-align:start;background:#EEF0F4;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.colm.pin{background:#FFF4D6}
.colm.me{background:var(--pink-soft)}
.colm > .ch{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:800;color:var(--acc);padding:2px 4px}
.colm > .ch small{font-weight:600;color:var(--text-lt);font-size:12px}
.kard{background:#fff;border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(20,24,31,.06)}
.kard .kt{font-size:15px;font-weight:800;color:var(--text);display:flex;justify-content:space-between;gap:6px}
.kard .kt button{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;white-space:nowrap}
.kard .ki{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.kard .ki img{width:100%;border-radius:10px;display:block;cursor:zoom-in;background:var(--bg)}
.kard pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;line-height:1.65;color:var(--text);margin-top:8px}
.kard .copy{margin-top:8px;border:1px dashed var(--pink);background:#fff;color:var(--pink);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.addc{border:1.5px dashed var(--acc-lt);background:rgba(255,255,255,.6);border-radius:12px;padding:11px;font-size:14px;font-weight:700;color:var(--acc);cursor:pointer;width:100%}
.kform{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kform input,.kform textarea{width:100%;font-size:15px;border:1px solid var(--border);border-radius:10px;padding:10px 11px;background:var(--bg);outline:none}
.kform textarea{min-height:150px;resize:vertical;line-height:1.6}
/* 로그인하면 폰에서도 스터디 판이 맨 위 */
.wrap.mf{display:flex;flex-direction:column}.wrap.mf .main{order:-1}
/* 맨 위 이번 스터디 미리보기: 일시·구글 미트·과제·신청 */
.hero{margin:12px 16px 4px;background:#fff;border-radius:16px;padding:16px 16px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hero .k{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.02em}
.hero .tt{font-size:19px;font-weight:800;margin:4px 0 2px;line-height:1.35}
.hero .wh{font-size:15px;font-weight:700;color:var(--ink,#222)}
.hero .go{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hero .go .btn{flex:1 1 160px;text-align:center;text-decoration:none}
.hero .meetbtn{background:#1a73e8;color:#fff;border:0}
.hero .note{font-size:13px;color:var(--mute,#888);margin-top:8px;line-height:1.5}
.hero .ok{font-size:13.5px;color:var(--ok);font-weight:700;margin-top:8px}
.hero .ok b{color:var(--ink,#222);font-weight:700}
.hero details{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.hero summary{cursor:pointer;font-size:15px;font-weight:800;list-style:none;display:flex;flex-direction:column;gap:2px}
.hero summary::-webkit-details-marker{display:none}
.hero summary small{font-size:12.5px;font-weight:600;color:var(--pink)}
.hero summary .more{font-size:13px;font-weight:700;color:var(--acc)}
.hero details[open] summary .more{display:none}
.hero .hw{max-height:200px;overflow:auto}
.pvbar{margin:12px 16px 0;background:#FFF4D6;color:#7A5200;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;line-height:1.5}
.pvbar a{color:inherit}
.vmode{display:flex;gap:4px;margin:12px 16px 0;background:#E6E9EF;border-radius:12px;padding:4px;width:fit-content}
.vmode button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--mute,#777);padding:8px 16px;border-radius:9px;cursor:pointer}
.vmode button.on{background:#fff;color:var(--ink,#222);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dayside{margin:12px 16px 0;background:#fff;border-radius:16px;overflow:hidden}

@media (min-width: 960px){ .vmode{margin:16px 32px 0} .dayside{margin:16px 32px 0;max-width:460px} .dayboard .sec{padding:24px 32px} .dayboard .colm{flex:0 0 320px} }
.hero .day{background:var(--ok-bg);color:var(--ok);font-weight:800;font-size:13px;border-radius:8px;padding:4px 9px;display:inline-block;margin-bottom:6px}

<body>
<div class="page">
  <div class="hd"><div class="t"><small>원팀 프로젝트 졸업반</small><h1>스터디방</h1></div><nav class="tracks" id="tracks"></nav></div>
  <div id="app"><div class="empty">불러오는 중…</div></div>
</div>
<script>
const U = 'https://vfgfvwqejfuqaxvtordh.supabase.co';
const KEY = 'sb_publishable_W_XKLh1kA5hZ-zFatXOhLQ_icQ-j1aW';
const IMG_PREFIX = U + '/storage/v1/object/public/study/';
// 스터디 종류 — 늘리려면 여기 한 줄 + 운영진 화면에서 그 종류로 스터디를 넣으면 된다
const TRACKS = [{id:'sns', name:'SNS 스터디'}, {id:'house', name:'부동산 스터디'}];
const TNAME = id => (TRACKS.find(t => t.id === id) || {name:id}).name;
function api(p){ return fetch(U + '/rest/v1/rpc/study_api', {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'}, body: JSON.stringify({p})}).then(r => r.json()); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const W = ['일','월','화','수','목','금','토'];
function when(iso){
  if(!iso) return '';
  const d = new Date(new Date(iso).toLocaleString('en-US', {timeZone:'Asia/Seoul'}));
  const h = d.getHours(), m = d.getMinutes();
  const part = h < 12 ? '오전' : h < 18 ? '오후' : '밤';
  return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]}) ${part} ${h % 12 || 12}시${m ? ' ' + m + '분' : ''}`;
}
function toast(t){ const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); }
let ME = null; try { ME = JSON.parse(localStorage.getItem('ot_study_me') || 'null'); } catch(e) {}
function saveMe(m){ ME = m; try { m ? localStorage.setItem('ot_study_me', JSON.stringify(m)) : localStorage.removeItem('ot_study_me'); } catch(e) {} }
let D = null, VIEW_ID = null, MODE = 'login', DRAFT = null, BUSY = false;
const hashTrack = () => { const h = location.hash.slice(1); return TRACKS.some(t => t.id === h) ? h : null; };
let TRACK = hashTrack() || 'sns';

function capi(p){ return fetch(U + '/rest/v1/rpc/challenge_api', {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'}, body: JSON.stringify({p})}).then(r => r.json()); }
let CH = null, CH_FOCUS = location.hash === '#challenge';
async function load(){
  const p = {track: TRACK}; if(VIEW_ID) p.study = VIEW_ID;
  if(ME){ p.h = ME.h; p.code = ME.code; }
  const [d, c, u] = await Promise.all([api(p), capi({track: TRACK}).catch(() => null), UP ? null : bapi({action:'upcoming'}).catch(() => null)]);
  D = d; CH = c && c.ok ? c.challenge : null; if(u && u.ok) UP = u;
  // 운영진 미리보기: 운영진 비번으로 들어온 탭에선 아직 '준비 중'인 스터디도 확정된 것처럼 보여줌 (멤버에겐 안 보임)
  if(D && D.ok && !D.study && AK){
    const a = await api({action:'admin', key:AK}).catch(() => null);
    const dr = a && a.ok ? (a.studies || []).filter(x => x.track === TRACK && x.status === 'draft').sort((x, y) => String(x.startsAt).localeCompare(String(y.startsAt)))[0] : null;
    if(dr){ D.study = Object.assign({}, dr, {status:'set', preview:true}); D.rsvp = ((a.boards || {})[dr.id] || {}).rsvp || []; }
  }
  CARDS = D.study ? ((await bapi(D.study.preview ? {study: D.study.id, key: AK} : {study: D.study.id}).catch(() => null)) || {}).cards || [] : [];
  if(ME && D.login && D.login !== 'ok'){ saveMe(null); }
  render();
  if(location.hash === '#apply' && !window.applyDone){ window.applyDone = true; setTimeout(() => { const e = $('#apply'); if(e) e.scrollIntoView({behavior:'smooth', block:'start'}); }, 80); }
  if(CH_FOCUS){ CH_FOCUS = false; setTimeout(() => { const e = $('#chal'); if(e) e.scrollIntoView({behavior:'smooth', block:'start'}); }, 80); }
}
// ── 챌린지: 날짜는 한국 시간 기준 'YYYY-MM-DD' 글자로 비교 ──
const kday = t => new Date(new Date(t).getTime() + 9 * 3600e3).toISOString().slice(0, 10);
const addDay = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
const md = d => { const x = new Date(d + 'T00:00:00Z'); return `${x.getUTCMonth()+1}/${x.getUTCDate()}`; };
function chWeeks(ch){ const out = []; for(let s = ch.start; s <= ch.end; s = addDay(s, 7)) out.push(s); return out; }
// 주마다 칸 두 개: 월~수(수요일 업로드) / 목~일(일요일 업로드)
function chSlots(ch, h){
  const ups = (ch.uploads || []).filter(u => u.h === h).map(u => kday(u.at));
  return chWeeks(ch).map(w => [[w, addDay(w, 3)], [addDay(w, 3), addDay(w, 7)]].map(([a, b]) => ups.some(d => d >= a && d < b)));
}
function chSection(me){
  const ch = CH; if(!ch) return '';
  const today = kday(Date.now()), on = today >= ch.start && today <= ch.end;
  const mem = (ch.members || []).find(m => m.h === me);
  const todo = (ch.config && ch.config.todo) || {};
  const wd = new Date(today + 'T00:00:00Z').getUTCDay();
  let h = `<div class="sec chal" id="chal"><h2>${esc(ch.title)} <span class="n">${(ch.members || []).length}팀 참여</span></h2>
    <div class="rule">${md(ch.start)} ~ ${md(ch.end)} · 주 2편 · <b>수요일·일요일</b>에 올리고 링크 인증<br>신청한 팀에게 매일 아침 8시 '오늘 할 일' 문자, 수·일 밤 9시엔 아직 안 올린 팀에게만 알림</div>`;
  h += on ? `<div class="today"><small>오늘 할 일 (${md(today)} ${W[wd]})</small>${esc(todo[wd] || '')}</div>` : today < ch.start ? `<div class="today"><small>시작 전</small>${md(ch.start)}(월)부터 시작해요</div>` : '';
  if(!me) h += `<div class="row"><button class="btn pink wide" onclick="needLogin()">로그인하고 신청하기</button></div>`;
  else if(!mem) h += `<div class="login"><label class="agree"><input type="checkbox" id="cja"> 챌린지 기간 동안 매일 아침 8시 '오늘 할 일' 문자와 수·일 밤 9시 업로드 알림을 받을게요. 스터디방에서 언제든 끌 수 있어요.</label></div>
      <div class="row"><button class="btn pink wide" onclick="cjoin()">챌린지 신청하기</button></div>`;
  else {
    h += `<div class="edit"><label for="ulink">올린 릴스·툰 링크</label><input id="ulink" placeholder="https://www.instagram.com/…">
      <label for="unote">한 줄 (선택)</label><input id="unote" maxlength="300" placeholder="예) 인스타툰 1편, 혼수 편">
      <div class="row"><button class="btn pink wide" onclick="upload()">업로드 인증하기</button></div></div>
      <div class="hint" style="text-align:center">신청함 · <a href="javascript:cmute()">${mem.muted ? '문자 다시 받기' : '문자 그만 받기'}</a> · <a href="javascript:cleave()">신청 취소</a></div>`;
  }
  return h + `</div>`;
}
function chBoard(me){
  const ch = CH; if(!ch || !(ch.members || []).length) return '';
  const ws = chWeeks(ch);
  let h = `<div class="sec"><h2>챌린지 도장판</h2><div class="stamps"><table><tr><th>팀</th>${ws.map((w, i) => `<th>${i + 1}주 <small style="color:var(--mute);font-weight:500">${md(w)}~</small></th>`).join('')}<th>합계</th></tr>`;
  ch.members.forEach(m => { const sl = chSlots(ch, m.h), n = sl.flat().filter(Boolean).length;
    h += `<tr><td>${esc(m.h)}${m.h === me ? ' (우리)' : ''}</td>${sl.map(w => `<td>${w.map(x => `<span class="s ${x ? 'on' : ''}">${x ? '✓' : ''}</span>`).join('')}</td>`).join('')}<td><b>${n}</b> / ${ws.length * 2}</td></tr>`; });
  h += `</table></div>`;
  const ups = (ch.uploads || []).slice(0, 12);
  if(ups.length) h += `<div class="ups" style="margin-top:12px">${ups.map(u => `<a href="${esc(u.link)}" target="_blank" rel="noopener"><b>${esc(u.h)}</b>${esc(u.note || '링크 열기')}<small>${esc(md(kday(u.at)))}</small>${u.h === me ? ` <small onclick="event.preventDefault();unupload(${u.id})" style="color:var(--pink)">지우기</small>` : ''}</a>`).join('')}</div>`;
  return h + `</div>`;
}
async function cjoin(){ if(!$('#cja').checked) return toast('문자 받기에 체크해 주세요'); const r = await capi({op:'cjoin', h:ME.h, code:ME.code, challenge:CH.id, agree:true}); if(!r.ok) return toast('다시 눌러주세요'); toast('신청했어요!'); load(); }
async function cmute(){ await capi({op:'cmute', h:ME.h, code:ME.code, challenge:CH.id}); load(); }
async function cleave(){ if(!window.leaveArm){ window.leaveArm = true; toast('한 번 더 누르면 신청이 취소돼요'); setTimeout(() => window.leaveArm = false, 3000); return; } await capi({op:'cleave', h:ME.h, code:ME.code, challenge:CH.id}); load(); }
async function upload(){
  const link = ($('#ulink').value || '').trim(), note = $('#unote').value;
  if(!/^https?:\/\//.test(link)) return toast('링크를 붙여넣어 주세요');
  const r = await capi({op:'upload', h:ME.h, code:ME.code, challenge:CH.id, link, note});
  if(!r.ok) return toast('다시 눌러주세요'); toast('도장 찍었어요!'); load();
}
async function unupload(id){ await capi({op:'unupload', h:ME.h, code:ME.code, challenge:CH.id, id}); load(); }
function mine(){ return ME && D && D.login === 'ok' ? ME.h : null; }

function renderTracks(){
  const tr = (D && D.tracks) || {};
  $('#tracks').innerHTML = location.hash === '#admin' ? '' : TRACKS.map(t => {
    const s = tr[t.id];
    const sub = !s ? '준비 중' : s.status === 'vote' ? '날짜 투표 중' : s.status === 'done' ? '지난 스터디' : when(s.startsAt).replace(/ (오전|오후|밤).*/, '');
    return `<a href="#${t.id}" class="${TRACK === t.id ? 'on' : ''}">${esc(t.name)}<small>${esc(sub)}</small></a>`;
  }).join('');
}

function dayOf(s){ const t = s && s.startsAt ? +new Date(s.startsAt) : 0, n = Date.now(); return s && s.status === 'set' && t && n > t - 2 * 3600e3 && n < t + 3 * 3600e3; }
function heroHtml(me, slim){
  const s = D && D.study; if(!s || s.status === 'done') return '';
  const rs = D.rsvp || [], yes = rs.filter(r => r.attend === 'yes').map(r => r.h), mineR = rs.find(r => r.h === me) || {};
  const today = dayOf(s);
  let h = `${s.preview ? `<div class="pvbar">운영진 미리보기 · 아직 멤버에겐 안 보여요. 운영진 화면에서 '확정'으로 저장하면 이대로 보이고 안내 문자가 나가요. <a href="#admin">운영진 화면</a></div>` : ''}<div class="hero" id="apply"><div>${today ? '<span class="day">오늘 스터디 날이에요</span>' : ''}<div class="k">이번 ${esc(TNAME(s.track || TRACK))}</div>
    <div class="tt">${esc(s.title)}</div><div class="wh">${s.status === 'vote' ? '날짜 투표 중이에요' : esc(when(s.startsAt))} · 구글 미트</div>${s.topic ? `<div class="note" style="margin-top:4px">${esc(s.topic)}</div>` : ''}${s.notes ? `<div class="note">${esc(s.notes)}</div>` : ''}</div>`;
  // 구글 미트: 당일엔 큰 버튼, 그 전엔 안내
  let go = '';
  if(s.status === 'set'){
    if(me && s.zoom && today) go += `<a class="btn meetbtn" href="${esc(s.zoom)}" target="_blank" rel="noopener">구글 미트 입장하기</a>`;
    if(today) go += `<button class="btn" onclick="${me ? "newCard('');setTimeout(()=>{const e=document.querySelector('.colm.me');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},80)" : "MODE='join';render();focusLogin()"}">${me ? '우리 팀 카드에 사진 올리기' : '신청하고 사진 올리기'}</button>`;
    else if(!me) go += `<button class="btn pink" onclick="MODE='join';render();focusLogin()">스터디 신청하기</button>`;
    else if(mineR.attend !== 'yes') go += `<button class="btn pink" onclick="attend('yes')">스터디 신청하기</button>`;
  }
  h += `<div>${go ? `<div class="go">${go}</div>` : ''}`;
  if(s.status === 'set'){
    if(me && s.zoom && !today) h += `<div class="note">구글 미트 입장 버튼은 스터디 당일에 여기 생겨요. <a href="${esc(s.zoom)}" target="_blank" rel="noopener">링크 미리 보기</a></div>`;
    else if(!me) h += `<div class="note">이름과 번호만 넣으면 신청돼요. 신청하면 구글 미트 링크가 보이고, 시작 1시간 전에 문자로도 보내드려요.</div>`;
    else if(!s.zoom) h += `<div class="note">구글 미트 링크는 곧 올라와요. 시작 1시간 전에 문자로도 보내드려요.</div>`;
  }
  if(me && mineR.attend === 'yes') h += `<div class="ok">신청 완료 · 아래 스터디 판에 우리 팀 열이 있어요</div>`;
  if(yes.length) h += `<div class="note">신청 ${yes.length}팀 · ${yes.map(x => `<b>${esc(x)}</b>`).join(', ')}</div>`;
  h += `</div>`;
  if(s.homework && !slim){
    const first = s.homework.split('\n').map(x => x.trim()).find(Boolean) || '미리 해올 것';
    h += `<details${innerWidth >= 960 ? ' open' : ''}><summary>과제 · ${esc(first.replace(/^(과제|미리 해올 것)\s*[:·]?\s*/, ''))}${s.homeworkDue ? `<small>${esc(when(s.homeworkDue))}까지 우리 팀 열에 올려주세요</small>` : ''}<span class="more">하는 법 펼치기 ›</span></summary>
      <div class="hw" id="hw">${esc(s.homework)}</div><div class="row"><button class="btn ghost" onclick="copyHw()">글 전체 복사</button></div></details>`;
  }
  return h + `</div>`;
}
function render(){
  if(location.hash === '#admin') return renderAdmin();
  renderTracks();
  if(!D || !D.ok){ $('#app').innerHTML = '<div class="empty">잠깐 연결이 안 돼요. 새로고침 해주세요.</div>'; return; }
  const me = mine(), s = D.study;
  let side = '', main = '';
  if(!s){ side += `<div class="sec"><div class="empty">다음 ${esc(TNAME(TRACK))} 일정이 곧 올라와요.</div></div>` + chSection(me); }
  else {
    const rs = D.rsvp || [], myR = rs.find(r => r.h === me) || {votes:[], attend:''};
    const open = s.status === 'vote' || s.status === 'set';
    // ① 일정 (지난 스터디만 — 이번 스터디는 맨 위 미리보기에)
    if(s.status === 'done'){
    side += `<div class="sec"><h2>${s.status === 'done' ? '지난 스터디' : '이번 스터디'}</h2><div class="card">`;
    side += s.status === 'vote' ? `<div class="when vote">날짜 투표 중이에요</div>` : `<div class="when">${esc(when(s.startsAt))}</div>`;
    side += `<div class="ttl">${esc(s.title)}</div>${s.topic ? `<div class="topic">${esc(s.topic)}</div>` : ''}`;
    if(s.status === 'set'){
      if(me && s.zoom) side += `<div class="meet">구글 미트 입장 <a href="${esc(s.zoom)}" target="_blank" rel="noopener">여기를 누르세요 ›</a></div>`;
      else if(s.hasZoom) side += `<div class="hint">구글 미트 링크는 로그인하면 보여요. 시작 1시간 전에 문자로도 보내드려요.</div>`;
    }
    if(s.notes) side += `<div class="hint">${esc(s.notes)}</div>`;
    side += `</div></div>`;
    }
    side += chSection(me);
    // 자료·다시보기 (들어온 팀만)
    if((s.links || []).length) side += `<div class="sec links"><h2>자료 · 다시보기</h2>${s.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label || '링크')}</span><span>›</span></a>`).join('')}</div>`;
    else if(s.hasLinks && !me) side += `<div class="sec links"><h2>자료 · 다시보기</h2><div class="hint" style="margin-top:0">로그인하면 PPT·다시보기 링크가 보여요.</div></div>`;
    // ② 날짜 투표 / 참석
    if(s.status === 'vote'){

  fit(); requestAnimationFrame(fit); setTimeout(fit, 400);
  tb.onscroll = () => { if(Math.abs(sh.scrollLeft - tb.scrollLeft) > 1) sh.scrollLeft = tb.scrollLeft; };
  sh.onscroll = () => { if(Math.abs(sh.scrollLeft - tb.scrollLeft) > 1) tb.scrollLeft = sh.scrollLeft; };

async function shrink(file){
  const bmp = await createImageBitmap(file).catch(() => null);
  if(!bmp) return file;
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
}

function upcomingHtml(){
  if(!UP) return '';
  const now = Date.now(), lim = now + 14 * 86400e3, ev = [];
  (UP.studies || []).forEach(s => {
    if(s.startsAt) ev.push({t: +new Date(s.startsAt), cls:'st', top: when(s.startsAt), main: TNAME(s.track) + ' · ' + s.title, href:'#' + s.track});
    else ev.push({t: now, cls:'st', top:'날짜 투표 중', main: TNAME(s.track) + ' · ' + s.title, href:'#' + s.track});
    if(s.homeworkDue && +new Date(s.homeworkDue) > now) ev.push({t: +new Date(s.homeworkDue), cls:'', top: when(s.homeworkDue) + '까지', main: TNAME(s.track) + ' 미리 해올 것 올리기', href:'#' + s.track});
  });
  (UP.challenges || []).forEach(c => {
    const days = (c.config && c.config.uploadDays) || [];
    for(let d = c.start; d <= c.end; d = addDay(d, 1)){
      const t = +new Date(d + 'T09:00:00+09:00'); if(t < now - 86400e3 || t > lim) continue;
      const wd = new Date(d + 'T00:00:00Z').getUTCDay();
      if(d === c.start) ev.push({t, cls:'ch', top: md(d) + '(' + W[wd] + ')', main: c.title + ' 시작', href:'#challenge'});
      else if(days.includes(wd)) ev.push({t: t + 12 * 3600e3, cls:'ch', top: md(d) + '(' + W[wd] + ')', main: c.title + ' 업로드 날', href:'#challenge'});
    }
  });
  const list = ev.filter(e => e.t >= now - 12 * 3600e3 && e.t <= lim).sort((a, b) => a.t - b.t).slice(0, 8);
  if(!list.length) return '';
  return `<div class="up"><h2>다가오는 일정</h2><div class="list">${list.map(e => `<a class="ev ${e.cls}" href="${e.href}"><b>${esc(e.top)}</b><span>${esc(e.main)}</span></a>`).join('')}</div></div>`;
}

  const st = $('#es').value;
  if(st === 'set' && !w) return $('#eerr').textContent = '확정이면 날짜·시간을 넣어주세요';
  if(st === 'vote' && opts.length < 2) return $('#eerr').textContent = '투표 후보를 두 개 이상 넣어주세요';
  const src = mode === 'leader' ? LEDIT : EDIT;
  const study = {id: src.id || '', track: $('#ek').value, status: st, title: $('#et').value, topic: $('#eto').value, startsAt: w, options: opts, zoom: $('#ez').value.trim(), homework: $('#eh').value, homeworkDue: d, notes: $('#en').value, links};
  const r = mode === 'leader' ? await api({op:'lsave', h:ME.h, code:ME.code, track:TRACK, study}) : await api({op:'save', key:AK, study});
  if(!r.ok) return $('#eerr').textContent = r.error === 'leader' ? '이 스터디의 스터디장만 고칠 수 있어요' : '저장이 안 됐어요';
  toast('저장했어요');
  if(mode === 'leader'){ LEDIT = null; load(); } else { EDIT = null; loadAdmin(); }
}
async function delMember(n){ if(window.delArm !== n){ window.delArm = n; toast('한 번 더 누르면 ' + n + ' 빠져요'); setTimeout(() => window.delArm = null, 3000); return; } await api({op:'delmember', key:AK, nick:n}); loadAdmin(); }
window.addEventListener('hashchange', () => {
  if(location.hash === '#admin') return renderAdmin();
  if(location.hash === '#challenge'){ CH_FOCUS = true; if(TRACK !== 'sns'){ TRACK = 'sns'; VIEW_ID = null; DRAFT = null; } }
  const t = hashTrack(); if(t && t !== TRACK){ TRACK = t; VIEW_ID = null; DRAFT = null; }
  load();
});
load();
</script>
