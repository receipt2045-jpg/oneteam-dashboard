<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>원팀 프로젝트 6기 · 과제방</title>
<meta property="og:title" content="원팀 프로젝트 6기 · 과제방">
<meta property="og:description" content="이번 주 과제, 라이브 다시보기, 다른 부부들 진행까지 한곳에서">
<script>
// 3·4기 현황판 링크(?term=3, ?term=4)는 지난 기수 페이지로 보낸다
if (/[?&]term=/.test(location.search)) location.replace('../past.html' + location.search);
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 5기 상세페이지와 같은 팔레트 — 흰 바탕에 네이비 하나 */
  --bg:#F7F8FA; --white:#FFF; --dark:#1C2B4A;
  --acc:#1B2A4E; --acc-soft:#EEF1F7; --acc-lt:#B9C8E2;
  --acc2:#2F3A4A; --acc2-soft:#EDEFF3;
  --text:#14181F; --text-md:#5A6172; --text-lt:#6B7280; --mute:#9AA0AC;
  --border:#E6E8EE; --warn:#854F0B; --warn-bg:#FBF6EC; --warn-line:#EAD9B5;
  --miss:#791F1F; --miss-bg:#FCEBEB;
}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--text);line-height:1.6;background:var(--bg);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh}
a{color:inherit}
button{font-family:inherit}

/* 맨 위 고정: 마감 타이머 + 메뉴 */
.top{position:sticky;top:0;z-index:20}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--dark);color:#fff;padding:11px 20px 10px}
.timer .l{font-size:12px;color:var(--acc-lt);line-height:1.45}
.timer .l b{display:block;color:#fff;font-weight:600;font-size:12.5px}
.timer .c{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer .c small{font-size:11px;font-weight:500;color:var(--acc-lt);margin:0 3px 0 1px}
.timer.urgent .c{color:#F4C0D1}
.menu{display:flex;gap:2px;overflow-x:auto;padding:0 10px;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.menu::-webkit-scrollbar{display:none}
.menu a{flex-shrink:0;text-decoration:none;font-size:14px;font-weight:600;color:var(--text-lt);padding:12px 10px 10px;border-bottom:2.5px solid transparent}
.menu a.on{color:var(--acc);border-bottom-color:var(--acc)}

.sec{padding:32px 22px;background:var(--white)}
/* 이번 주 해야 할 일 배너 — 모든 화면 맨 위 */
.newfile{display:flex;align-items:center;gap:6px;background:#FDF1F5;border-bottom:1px solid #F4D3DE;padding:10px 14px 10px 20px}
.newfile a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.newfile .ic{font-size:20px;flex-shrink:0}
.newfile .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.newfile b{font-size:13.5px;font-weight:700;color:#A3284F;letter-spacing:-.02em}
.newfile small{font-size:12px;color:#B4536F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newfile .go{flex-shrink:0;font-size:13px;font-weight:700;color:#A3284F}
.newfile.read{background:#F4F6FB;border-bottom:1px solid #DCE1EC}
.newfile.read b{color:#232B38}.newfile.read small{color:#5A6372}.newfile.read .go{color:#232B38}
.rdm{position:fixed;inset:0;background:rgba(20,24,32,.55);z-index:999;display:flex;align-items:flex-end;justify-content:center}
.rdm .box{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:26px 22px 22px;color:#232B38;line-height:1.7}
.rdm h3{font-size:19px;font-weight:800;margin:0 0 4px}.rdm .sub{font-size:13px;color:#6B7280;margin-bottom:16px}
.rdm h4{font-size:14px;font-weight:800;margin:16px 0 4px;color:#8A4B5E}.rdm p,.rdm li{font-size:14px}.rdm ul{margin:0;padding-left:18px}
.rdm .ex{background:#FFF6CC;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.rdm .cta{display:block;text-align:center;background:#232B38;color:#fff;font-weight:800;border-radius:12px;padding:14px;margin-top:20px;text-decoration:none}
.rdm .close{display:block;width:100%;background:none;border:0;color:#6B7280;font-size:13px;margin-top:10px;padding:8px;cursor:pointer}
@media(min-width:600px){.rdm{align-items:center}.rdm .box{border-radius:18px}}
.newfile button{flex-shrink:0;background:none;border:0;color:#B4536F;font-size:14px;cursor:pointer;padding:6px}
.files{margin-top:16px;display:grid;gap:10px}
.fl{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit}
.fl:hover{border-color:var(--acc-lt)}
.fl .ic{flex-shrink:0;width:42px;height:54px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:800;display:grid;place-items:center}
.fl .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fl b{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.fl b i{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:#E5487A;border-radius:4px;padding:1px 5px;vertical-align:2px;margin-left:2px}
.fl small{font-size:12.5px;color:var(--text-md);line-height:1.5}
.fl small.m{color:var(--text-lt);font-size:11.5px}
.fl .dl{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--acc);font-weight:700}
body[data-locked="1"] #menu,body[data-locked="1"] footer{display:none}
.todo{background:var(--acc-soft);border-bottom:1px solid var(--border);padding:14px 20px 16px}
.todo .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;cursor:pointer;text-align:left;color:var(--text);padding:0}
.todo .hd b{font-size:15px;font-weight:700;letter-spacing:-.03em}
.todo .hd span{font-size:12px;color:var(--text-md);font-weight:500;margin-left:6px}
.todo .hd i{font-style:normal;font-size:12px;font-weight:700;color:var(--acc);background:#fff;border-radius:99px;padding:3px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.todo .hd i svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4}
.todo ul{list-style:none;margin-top:10px;display:grid;gap:6px}
.todo li{display:flex;align-items:center;background:#fff;border-radius:10px}
.todo li a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 12px 10px 8px;font-size:13.5px;line-height:1.45;color:inherit}
.todo li .ck{flex-shrink:0;width:22px;height:22px;margin-left:10px;border-radius:50%;border:1.5px solid var(--acc-lt);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;cursor:pointer;padding:0;font-family:inherit}
.todo li .ck:hover{border-color:var(--acc)}
.todo li .ck:disabled{cursor:default}
.todo li.ok .ck{background:var(--acc);border-color:var(--acc)}
.todo li.ok .tx{color:var(--mute);text-decoration:line-through}
.todo li .k{flex-shrink:0;font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:2px 7px}
.todo li .tx{flex:1;min-width:0}
.todo li .go{flex-shrink:0;color:var(--mute);font-size:13px}
.todo .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--text-md)}
.todo .ft a.sb{flex-shrink:0;text-decoration:none;background:var(--acc);color:#fff;font-weight:700;font-size:13px;border-radius:99px;padding:8px 14px}
.sec-alt{padding:32px 22px;background:var(--bg)}
.sec-dark{padding:32px 22px 30px;background:var(--dark);color:#fff}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--acc);display:block;margin-bottom:8px}
.sec-dark .eyebrow{color:var(--acc-lt)}
.h1{font-size:25px;font-weight:700;line-height:1.4;letter-spacing:-.035em}
.h2{font-size:21px;font-weight:700;line-height:1.42;letter-spacing:-.032em}
.body1{font-size:14px;line-height:1.75;color:var(--text-md);margin-top:7px}
.sec-dark .body1{color:rgba(255,255,255,.7)}
.hl{color:var(--acc)}
.lb{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:5px}
.lb.g{color:var(--acc2);background:var(--acc2-soft)}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px 15px;margin-top:10px}
.nm{font-size:16.5px;font-weight:700;margin-top:6px;letter-spacing:-.03em;line-height:1.4}
.ds{font-size:13px;color:var(--text-md);margin-top:3px;line-height:1.6}
.or-line{border-top:1px dashed var(--border);margin:14px 0 2px}
.btns{display:flex;gap:6px;margin-top:12px}
.b{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;padding:10px 6px;border-radius:9px;border:1px solid var(--acc);color:var(--acc);background:#fff;text-decoration:none;cursor:pointer;text-align:center;line-height:1.3}
.b.fill{background:var(--acc);color:#fff}
.b.off{border-color:var(--border);color:var(--mute);background:var(--bg);cursor:default}
.btn{display:block;text-align:center;background:var(--acc);color:#fff;font-size:16px;font-weight:600;padding:17px;border-radius:12px;text-decoration:none;margin-top:20px}
.note{text-align:center;font-size:12px;color:var(--text-lt);margin-top:10px}

/* 과제 예시 (펼침) */
.ex{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.ex.open{display:block}
.ex h4{font-size:12.5px;font-weight:700;color:var(--acc);margin:12px 0 6px}
.ex h4:first-child{margin-top:0}
.ex ol{padding-left:18px;font-size:13px;color:var(--text-md);line-height:1.75}
.ex pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.75;background:var(--bg);border-radius:10px;padding:12px 13px;color:var(--text)}
.ex .copy{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border:0;border-radius:7px;padding:5px 10px;cursor:pointer}
.ex .warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.6}
.ex .tbd{font-size:12px;color:var(--mute);margin-top:8px}
/* 4기 잘한 과제 */
.ex .best{border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-top:8px}
.ex .best .w{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-md)}
.ex .best .w b{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:5px;padding:2px 7px}
.ex .best pre{background:none;padding:0;margin-top:7px;max-height:9.5em;overflow:hidden;position:relative}
.ex .best.open pre{max-height:none}
.ex .best .rd{margin-top:4px;font-size:12px;font-weight:600;color:var(--acc);background:none;border:0;cursor:pointer;padding:0}
.ex .shot{display:block;width:100%;max-height:520px;object-fit:cover;object-position:top;border:1px solid var(--border);border-radius:10px}
.ex .bnote{font-size:11.5px;color:var(--mute);margin-top:-2px}
.replay{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border);text-decoration:none;color:inherit}
.replay:last-child{border-bottom:1px solid var(--border)}
.replay .d{width:46px;flex-shrink:0;font-size:12px;color:var(--text-lt);line-height:1.3}
.replay .d b{display:block;font-size:17px;color:var(--acc);letter-spacing:-.03em}
.replay .t{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.03em;line-height:1.45}
.replay .go{font-size:12.5px;font-weight:700;color:var(--acc);white-space:nowrap}

/* 과정별 주차 줄 */
/* 과제 예시 페이지 (#ex/과정/주차) — 단계마다 띠를 바꿔 구분, 아래에 제출 버튼 고정 */
.back{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;font-weight:600;color:var(--text-lt);text-decoration:none;margin-bottom:14px}
.exh{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.03em;margin-bottom:12px}
.exh span{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:12.5px;display:grid;place-items:center}
.exsub{font-size:12.5px;color:var(--text-lt);margin:-6px 0 10px}
.ex.flat{display:block;margin:0;border:0;padding:0}
.ex.flat pre{background:var(--white);border:1px solid var(--border)}
.sec .ex.flat pre{background:var(--bg);border:0}
.ex.flat .best pre{background:none;border:0;padding:0}
.exbar{position:sticky;bottom:0;display:flex;gap:8px;background:var(--white);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.exbar .b{flex:0 0 auto;padding:13px 16px;font-size:14px}
.exbar .b.fill{flex:1;font-size:15px}
.wrow{padding:16px 0;border-top:1px solid var(--border)}
.wrow:last-child{border-bottom:1px solid var(--border)}
.wrow .w{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-lt)}
.wrow .w b{color:var(--acc)}
.wrow .t{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:-.03em}
.wrow.lock .t,.wrow.lock .w b{color:var(--mute)}

/* MVP */
/* MVP — 밝은 바탕 흰 카드. 한 줄 요약(결영님 소개 문구 또는 첫 문장)을 크게, 본문은 칸 이름별로 나눠 접어둔다 */
.sec-mvp{padding:32px 22px 30px;background:var(--acc-soft)}
.mvp{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;margin-top:14px;box-shadow:0 1px 2px rgba(27,42,78,.04)}
.mvp .who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--text-lt)}
.mvp .who b{color:var(--text);font-weight:700}
.mvp .tag{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:5px;white-space:nowrap}
.mvp .tt{font-size:13px;font-weight:600;color:var(--text-lt);margin-top:10px}
.mvp .qt{font-size:17px;font-weight:700;line-height:1.6;letter-spacing:-.025em;color:var(--acc);margin-top:6px;padding-left:12px;border-left:3px solid var(--acc)}
.mvp .pick{font-size:11.5px;color:var(--text-lt);margin-top:6px;padding-left:15px}
.mvp .body{position:relative;margin-top:14px;max-height:12.5em;overflow:hidden}
.mvp .body::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3.5em;background:linear-gradient(rgba(255,255,255,0),var(--white))}
.mvp.open .body{max-height:none}
.mvp.open .body::after{display:none}
.mvp .fld+.fld{margin-top:12px}
.mvp .fld.s{display:flex;gap:12px;align-items:baseline}
.mvp .fld.s .k{flex:0 0 6.5em;margin:0}
.mvp .fld.s .v{font-size:14px;color:var(--text)}
.mvp .fld.s+.fld.s{margin-top:5px}
.mvp .fld .k{display:block;font-size:12px;font-weight:700;color:var(--acc);margin-bottom:3px}
.mvp .fld .v{font-size:14.5px;line-height:1.75;color:var(--text-md);word-break:keep-all;overflow-wrap:anywhere}
.mvp .fld .v p+p{margin-top:8px}
.mvp .lnk{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--acc)}
.mvp .more{margin-top:12px;padding:11px;font-size:13.5px}
.mvp-empty{font-size:14px;line-height:1.75;color:var(--text-md);margin-top:10px}

/* 부부 진행판 */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.stats div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center}
.stats b{display:block;font-size:23px;font-weight:700;color:var(--acc);letter-spacing:-.04em;line-height:1.25}
.stats span{font-size:11.5px;color:var(--text-lt)}
.seg{display:inline-flex;background:var(--acc2-soft);border-radius:9px;padding:3px;margin-top:18px}
.seg button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--text-lt);padding:6px 13px;border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cp{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);font-size:14.5px}
.cp:last-child{border-bottom:1px solid var(--border)}
.cp .n{width:118px;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.cp .n span.nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .tr{font-size:10.5px;font-weight:700;color:var(--acc2);background:var(--acc2-soft);padding:1px 6px;border-radius:4px;flex-shrink:0}
.cp .bar{flex:1;height:7px;background:var(--acc-soft);border-radius:4px;overflow:hidden}
.cp .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.cp .v{width:38px;text-align:right;font-size:13px;color:var(--text-md);font-variant-numeric:tabular-nums}
.cp.done .v{color:var(--acc);font-weight:700}
.cp.click{cursor:pointer}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#F1F2F4;border:0;border-radius:12px;padding:14px;margin-top:12px;font-family:inherit;font-size:14.5px;font-weight:700;color:#4B5160;cursor:pointer}
.more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Q&A */
.qa{background:var(--bg);border-radius:12px;padding:15px 16px;margin-top:10px}
.sec-alt .qa{background:#fff;border:1px solid var(--border)}
.qa .qt{font-size:14.5px;font-weight:600;line-height:1.6}
.qa .qt::before{content:"Q. ";color:var(--acc);font-weight:800}
.qa .at{font-size:13.5px;color:var(--text-md);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.7;white-space:pre-wrap}
.qa{cursor:pointer}.qa .qt{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qa .at{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.qa.open .qt,.qa.open .at{display:block;-webkit-line-clamp:unset;overflow:visible}
.qa .more-t{float:right;color:var(--acc);font-weight:600}.qa .more-t svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 2px}
.qnav button{font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--text-md);cursor:pointer}
.qnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qnav button i{font-style:normal;margin-left:4px;opacity:.8}
.qa .at.wait{color:var(--mute)}
.qa .meta{font-size:11.5px;color:var(--text-lt);margin-top:5px}
.empty{font-size:14px;color:var(--text-lt);padding:22px 0;text-align:center}

/* 우리 부부 */
.login{padding-top:44px}
.login .box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 18px 18px;margin-top:22px}
.login label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin:14px 0 6px}

function getJSON(url){
  return new Promise((resolve,reject)=>{
    let done=false, running=0, sent=0;
    const fire=()=>{
      if(done||sent>=3) return; sent++; running++;
      const ac=new AbortController(), to=setTimeout(()=>ac.abort(),40000);
      rpc(qs(url), ac.signal)
        .then(j=>{ if(j&&j.ok!==undefined&&!done){ done=true; resolve(j); } else throw 0; })
        .catch(()=>{ if(!done) fire(); })
        .finally(()=>{ clearTimeout(to); running--; if(!done&&running===0&&sent>=3) reject(new Error('load failed')); });
    };
    fire(); setTimeout(fire,4000); setTimeout(fire,9000);
  });
}

  return rpc(Object.assign({key:getKey()}, body));
}

// MVP 본문 나누기 — "알게 된 점 :" 같은 줄에서 새 칸이 시작된다 (주소의 https: 는 칸 이름으로 보지 않는다)
function fieldsOf(body){
  const out=[]; let cur={k:'',v:[]};
  String(body||'').replace(/\r/g,'').split('\n').forEach(line=>{
    const m=line.match(/^\s*([^:\n]{1,24}?)\s*:\s*(.*)$/);
    if(m && !/^https?$/i.test(m[1].trim()) && !/[\/.]/.test(m[1])){ out.push(cur); cur={k:m[1].trim(),v:m[2]?[m[2]]:[]}; }
    else cur.v.push(line);
  });
  out.push(cur);
  return out.map(f=>({k:f.k,v:f.v.join('\n').replace(/\n{3,}/g,'\n\n').trim()})).filter(f=>f.v);
}
// 한 줄 요약 — 첫 칸의 첫 문장 (너무 길면 자른다)
const META_K=/어떤 강의|어느 라이브/;
// 본문 → 문단 HTML. 빈 줄은 문단 사이 짧은 간격으로, 문장 중간에 끊긴 줄(폰에서 친 줄바꿈)은 이어 붙인다.
// 목록(- · 1.)이나 짧은 줄은 그대로 줄을 바꾼다
function parasHtml(v){
  return String(v||'').split(/\n\s*\n/).map(p=>{
    const L=p.split('\n').map(s=>s.trim()).filter(Boolean); let out='';
    L.forEach((s,j)=>{
      if(!j){ out=esc(s); return; }
      const prev=L[j-1], soft=prev.length>=20 && !/[.!?…~)」"'”:]$|[다요음함죠네]$/.test(prev) && !/^([-•·*▶✔︎✓]|\d+[.)])/.test(s);
      out+=(soft?' ':'<br>')+esc(s);
    });
    return `<p>${out}</p>`;
  }).join('');
}
function firstLine(F){
  const v=(F[0]&&F[0].v||'').replace(/\s+/g,' ').trim();
  const s=(v.match(/^.+?[.!?](\s|$)|^.+?(다|요)\.?(\s|$)/)||[v])[0].trim();
  return s.length>80?s.slice(0,78)+'…':s;
}
// 부부 하나의 주차별 완료 {live,read,money,pick} — 한 주 4개. 택1은 내집·SNS 중 하나만 내도 완료
function progress(h, week){
  const mine=(DATA.subs||[]).filter(s=>s.h===h).map(s=>parseTask(s.task)).filter(Boolean).filter(t=>t.week===week);
  const has=k=>mine.some(t=>t.track===k);
  return {live:has('live'), read:has('read'), money:has('money'), house:has('house'), sns:has('sns'), get pick(){return this.house||this.sns;},
    get done(){return (this.live?1:0)+(this.read?1:0)+(this.money?1:0)+(this.pick?1:0);}};
}
const PER = 4;  // 한 주 과제 수
function choiceOf(h){
  let hs=0, sn=0;
  (DATA.subs||[]).filter(s=>s.h===h).forEach(s=>{const t=parseTask(s.task); if(!t)return; if(t.track==='house')hs++; if(t.track==='sns')sn++;});
  return hs&&sn?'둘 다':hs?'내집':sn?'SNS':'';
}

let view='home', boardMode='week', boardAll=false, openDetail=null;
function render(){
  const v=(location.hash||'#home').slice(1), exm=v.match(/^ex\/(read|money|house|sns|live)\/(\d)$/), wrm=v.match(/^write\/(house)\/(\d)$/);
  view=exm?'ex':wrm?'write':['home','read','money','house','sns','qa','files','mine','admin','grad','ops','coach','vod'].includes(v)?v:'home';
  let tab=exm?(exm[1]==='live'?'home':exm[1]):wrm?wrm[1]:view;
  if(['read','money','house','sns'].includes(tab)) tab='tasks';   // 11/17 결영: 과정 넷은 '과제' 아래 하위 메뉴로
  document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.dataset.v===tab));

  const bn=document.getElementById('banner'), el=document.getElementById('view');
  // 졸업반 탭은 5기 로그인 없이 본다 (졸업반 멤버도 들어온다)
  const locked=isLocked() && view!=='admin' && view!=='grad';
  document.body.dataset.locked=locked?'1':'';
  if(view==='grad'){ if(bn) bn.innerHTML=''; el.innerHTML=gradView(); loadGrad(); return; }
  // 운영진 로그인 칸은 과제 데이터 없이 그린다 (로그인 전엔 DATA가 비어 있다)
  if(view==='admin' || (view==='ops' && !ADMIN)){ if(bn) bn.innerHTML=''; el.innerHTML=adminLogin(); return; }
  if(locked){ if(bn) bn.innerHTML=''; el.innerHTML=gateView(); return; }
  if(bn) bn.innerHTML=liveCard()+readBanner()+filesBanner()+(DATA?banner():'');
  if(!DATA){ el.innerHTML='<div class="state">과제 정보를 불러오지 못했어요.<br>잠시 뒤에 새로고침해 주세요.</div>'; return; }
  el.innerHTML = view==='ex'?exView(exm[1],+exm[2]) : view==='write'?writeView(wrm[1],+wrm[2]) : view==='home'?homeView() : view==='qa'?qaView() : view==='files'?filesView() : view==='mine'?mineView() : view==='admin'?adminLogin() : view==='ops'?opsView() : view==='coach'?coachView() : view==='vod'?vodView() : trackView(view);
}

      <div class="body">${F.map(f=>`<div class="fld${f.k&&f.v.length<=24&&f.v.indexOf(String.fromCharCode(10))<0?' s':''}">${f.k?`<span class="k">${esc(f.k)}</span>`:''}<div class="v">${parasHtml(f.v)}</div></div>`).join('')}</div>
      ${m.link?`<a class="lnk" href="${esc(m.link)}" target="_blank" rel="noopener">게시물 보기 ›</a>`:''}

  return h+`</div>`+replays();
}

function board(cw){
  const n=ROSTER.length;
  if(!cw){
    const ot=ROSTER.map(r=>({h:r,ok:progress(r,0).live})).sort((a,b)=>b.ok-a.ok||ROSTER.indexOf(a.h)-ROSTER.indexOf(b.h));
    const nOk=ot.filter(x=>x.ok).length;
    return `<span class="eyebrow">${COHORT}기 ${n}부부${DATA._loading?' · 불러오는 중…':''}</span><div class="h2">OT 출석 <span class="hl">${nOk}/${n}</span> 부부</div>
      <div class="body1">OT 주 과제는 강의 출석 하나예요. 1주차(11/24)부터는 한 주에 4개 — 강의 출석·독서·돈관리·내집마련/SNS 중 하나.</div>
      <div style="margin-top:14px">${ot.map(x=>`<div class="cp${x.ok?' done':''}${ADMIN?' click':''}" ${ADMIN?`onclick="openDetail=openDetail===${JSON.stringify(x.h).replace(/"/g,'&quot;')}?null:${JSON.stringify(x.h).replace(/"/g,'&quot;')};render()"`:''}><span class="n"><span class="nn">${esc(x.h)}</span></span><span class="bar"><i style="width:${x.ok?100:0}%"></i></span><span class="v">${x.ok?1:0}/1</span></div>${ADMIN&&openDetail===x.h?detailOf(x.h):''}`).join('')}</div>`;
  }
  // 이번 주 / 전체
  const rows=ROSTER.map(r=>{
    if(boardMode==='week'){ const p=progress(r,cw); return {h:r,done:p.done,total:PER}; }
    // 전체 = OT 출석 1개 + 1주차부터 한 주 4개
    let d=progress(r,0).live?1:0; for(let w=1;w<=cw;w++) d+=progress(r,w).done; return {h:r,done:d,total:1+cw*PER};
  }).sort((a,b)=>b.done-a.done||ROSTER.indexOf(a.h)-ROSTER.indexOf(b.h));
  const wk=ROSTER.map(r=>progress(r,cw));
  const sum=wk.reduce((a,p)=>a+p.done,0), full=wk.filter(p=>p.done===PER).length;
  const hs=wk.filter(p=>p.house).length, sn=wk.filter(p=>p.sns).length;
  const shown=boardAll?rows:rows.slice(0,8);
  let h=`<span class="eyebrow">${COHORT}기 ${n}부부${DATA._loading?' · 불러오는 중…':''}</span><div class="h2">${cw}주차, <span class="hl">다들 여기까지</span> 왔어요</div>
    <div class="stats"><div><b>${Math.round(sum/(n*PER)*100)}%</b><span>이번 주 달성</span></div><div><b>${full}</b><span>다 한 부부</span></div><div><b>${hs} · ${sn}</b><span>내집 · SNS</span></div></div>
    <div class="seg"><button class="${boardMode==='week'?'on':''}" onclick="boardMode='week';render()">이번 주</button><button class="${boardMode==='all'?'on':''}" onclick="boardMode='all';render()">${cw>1?'OT~'+cw+'주 전체':'OT 포함 전체'}</button></div>
    <div style="margin-top:12px">`;
  shown.forEach(r=>{
    const c=choiceOf(r.h), w=r.total?Math.round(r.done/r.total*100):0;
    h+=`<div class="cp${r.done===r.total?' done':''}${ADMIN?' click':''}" ${ADMIN?`onclick="openDetail=openDetail===${JSON.stringify(r.h).replace(/"/g,'&quot;')}?null:${JSON.stringify(r.h).replace(/"/g,'&quot;')};render()"`:''}>
      <span class="n"><span class="nn">${esc(r.h)}</span>${c?`<span class="tr">${c}</span>`:''}</span>
      <span class="bar"><i style="width:${w}%"></i></span><span class="v">${r.done}/${r.total}</span></div>`;
    if(ADMIN && openDetail===r.h) h+=detailOf(r.h);
  });
  if(rows.length>8) h+=`<button class="more" onclick="boardAll=!boardAll;render()">${boardAll?`접기 ${chev(true)}`:`${n}부부 모두 보기 ${chev(false)}`}</button>`;
  return h+`</div>`;
}

// 녹화본 모음 (#vod, 11/17 결영 '녹화본 모음집 게시판') — OT + 주차별 화(내집마련)·목(SNS) 강의를 한 줄씩
//   링크는 운영진 화면 '링크'에서 넣는 그대로(liveLinks). 미트 주소는 녹화본이 아니라 '라이브 입장'으로 본다
//   본 강의는 이 기기에 체크(ot6vod) — 출석은 출석 칸에서 따로
function vodSeen(){ try{ return JSON.parse(localStorage.getItem('ot'+COHORT+'vod')||'{}'); }catch(e){ return {}; } }
function vodToggle(k){ const o=vodSeen(); o[k]=!o[k]; if(!o[k]) delete o[k]; try{ localStorage.setItem('ot'+COHORT+'vod',JSON.stringify(o)); }catch(e){} render(); }
function vodView(){
  const L=liveLinks(), now=NOW(), seen=vodSeen(), yr=String((WEEKS[0]&&WEEKS[0].open)||'2026').slice(0,4);
  const at=md=>{ const [m,d]=String(md).split('/').map(Number); return new Date(`${yr}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}T21:00:00+09:00`).getTime(); };
  const rows=[{k:'0|OT', wk:'OT', d:OT.date, day:OT.day||'목', t:OT.title, url:L['0|OT'], live:0}];
  WEEKS.forEach(w=>{
    [['내집마련','house',w.tue],['SNS','sns',w.thu]].forEach(([tr,k,d])=>rows.push({k:w.n+'|'+tr, wk:w.n+'주차', d, day:TRACKS[k].live,
      t:`${tr} · ${TASKS[k][w.n].name}`, who:TRACKS[k].who, url:L[w.n+'|'+tr], live:w.n}));
  });
  const isMeet=u=>/meet\.google\.com/.test(u||'');
  const nSeen=rows.filter(r=>seen[r.k]).length, nRec=rows.filter(r=>r.url&&!isMeet(r.url)).length;
  let h=`<section class="sec"><span class="eyebrow">라이브 다시보기</span><div class="h1">녹화본 모음</div>
    <div class="body1">강의가 끝나면 녹화본이 여기에 올라와요. 못 오신 날은 다시보기로 보고 출석하면 돼요.</div>
    <div class="note" style="text-align:left;margin-top:8px">올라온 녹화본 ${nRec}/${rows.length} · 내가 본 것 ${nSeen} · 녹화본은 한 달간 볼 수 있어요</div></section>`;
  if(!hasLinks()) return h+`<section class="sec-alt"><div class="body1">다시보기는 ${COHORT}기 부부만 볼 수 있어요. 내 과제 탭에서 한 번 로그인하면 목록이 열려요.</div><a class="btn" href="#mine" style="margin-top:14px">로그인하기</a></section>`;
  let lastWk='';
  h+=`<section class="sec-alt">`;
  rows.forEach(r=>{
    if(r.wk!==lastWk){ h+=`<div class="lb" style="margin-top:${lastWk?18:0}px">${r.wk}</div>`; lastWk=r.wk; }
    const t0=at(r.d), past=now>t0+2*3600e3, today=now>t0-12*3600e3&&!past;
    let go;
    if(r.url&&!isMeet(r.url)) go=`<a class="go" href="${esc(r.url)}" target="_blank" rel="noopener">▶ 다시보기</a>`;
    else if(today&&r.url) go=`<a class="go" href="${esc(r.url)}" target="_blank" rel="noopener">▶ 라이브 입장</a>`;
    else if(!past) go=`<span class="go" style="color:var(--text-lt)">예정 · 밤 9시</span>`;
    else go=`<span class="go" style="color:var(--text-lt)">녹화본 준비 중</span>`;
    const ck=seen[r.k];
    h+=`<div class="replay"><button class="ck" style="flex-shrink:0" onclick="vodToggle('${r.k}')" title="본 강의 체크" aria-label="${ck?'봤어요':'보면 체크'}">${ck?'✓':''}</button><span class="d">${r.day}<b>${r.d}</b></span><span class="t">${esc(r.t)}${r.who?` <small style="color:var(--text-lt);font-weight:500">· ${esc(r.who)}</small>`:''}<br><a href="#ex/live/${r.live}" style="font-size:12px;font-weight:500;color:var(--text-lt)">이 강의 출석하기 ›</a></span>${go}</div>`;
  });
  return h+`</section>`;
}

// 11/24 결영: 강의 날 미트 링크가 바로 안 보여 애먹음 → 강의 날엔 모든 화면 맨 위에 입장 칸.
//   링크는 로그인한 부부만 받는 liveLinks(미트 주소는 공개 코드에 없다). 다음 날은 녹화본이 있으면 다시보기, 없으면 안 띄움
function liveCard(){
  const now=NOW(), yr=String((WEEKS[0]&&WEEKS[0].open)||'2026').slice(0,4);
  const ymd=md=>{ const [m,d]=String(md).split('/').map(Number); return `${yr}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; };
  const L=liveLinks(), isMeet=u=>/meet\.google\.com/.test(u||'');
  let lec=null, when='';
  for(const x of lectures()){ const d0=kst(ymd(x.d)); if(now>=d0 && now<d0+864e5){ lec=x; when='today'; break; } if(now>=d0+864e5 && now<d0+2*864e5){ lec=x; when='next'; } }
  if(!lec) return '';
  const url=L[lec.k]||'', rec=url&&!isMeet(url), title=lec.tr==='OT'?'OT 라이브':`${lec.tr} ${lec.w}강 라이브`;

        if(f.cat && String(r[3]).trim() !== '' && Number(r[3]) >= 0 && Number(r[3]) <= 100){ wsum[f.cat] = (wsum[f.cat] || 0) + Math.round(Number(r[3])); wlim[f.k] = Math.round(Number(r[3])); }
        let v = vc != null ? r[vc] : r.slice(lc + 1).find(x => String(x).trim() !== '');
        if(v === undefined || String(v).trim() === '') break;
        v = String(v).trim();
        if(f.max){ const lim = wlim[f.k] != null ? wlim[f.k] : f.max, x = Math.round(Number(v)); if(!(x >= 0 && x <= lim)) break; v = String(x); }
        got[f.k] = v; break;
      }
    });
    Object.keys(wsum).forEach(c => { got['배점:' + c] = String(Math.min(IP_CAT_MAX, wsum[c])); });
    Object.keys(wlim).forEach(k => { got['배점:' + k] = String(wlim[k]); });
    if(got['단지명'] === 'DMC센트럴자이') return;
    Object.keys(got).forEach(k => { if(out[k] == null) out[k] = got[k]; });
  });
  return out;
}

  const all=DATA.qa||[], trk=q=>{ const t=parseTask(q.task); return !t?'etc':t.track==='live'?qaTopic(q.q):t.track; };
  const tabs=[['all','전체']].concat(['money','house','sns','read'].map(k=>[k,TRACKS[k].name]),[['etc','기타']]).map(([k,n])=>[k,n,k==='all'?all.length:all.filter(q=>trk(q)===k).length]).filter(x=>x[0]==='all'||x[2]);
  if(!tabs.some(x=>x[0]===qaTab)) qaTab='all';
  const list=all.filter(q=>qaTab==='all'||trk(q)===qaTab), byNew=(a,b)=>new Date(b.at)-new Date(a.at);

  if(all.length) h+=`<div class="qnav">${tabs.map(([k,n,c])=>`<button class="${k===qaTab?'on':''}" onclick="setQa('${k}')">${n}<i>${c}</i></button>`).join('')}</div>`;
  if(!all.length) h+=`<div class="empty">${DATA._loading?'불러오는 중이에요…':'아직 올라온 질문이 없어요'}</div>`;
  const card=q=>{ const t=parseTask(q.task), tag=t?`${wkName(t.week)} ${TRACKS[t.track].name}`:'', op=qaOpen.has(q.id), k=JSON.stringify(String(q.id)).replace(/"/g,'&quot;');
    return `<div class="qa${op?' open':''}" onclick="qaOpen.has(${k})?qaOpen.delete(${k}):qaOpen.add(${k});render()"><div class="qt">${esc(q.q)}</div>${q.a?`<div class="at">${esc(q.a)}</div>`:`<div class="at wait">답변을 준비하고 있어요</div>`}
      <div class="meta">${esc(tag)}${q.by?' · '+esc(q.by):''}${q.at?' · '+fmtD(q.at):''}<span class="more-t">${op?'접기':'전체 보기'} ${chev(op)}</span></div></div>`; };
  if(done.length) h+=`<div class="sub" style="margin-top:14px">답변 완료 · ${done.length}</div>`+done.map(card).join('');
  if(wait.length) h+=`<div class="sub" style="margin-top:18px">답변 준비 중 · ${wait.length}</div>`+wait.map(card).join('');
  return h+`</section>`;
}

async function optimistic(id,patch,body,okMsg,failMsg){
  const row=(ADMIN&&ADMIN.rows||[]).find(r=>r.id===id); if(!row) return;
  const old={}; Object.keys(patch).forEach(k=>old[k]=row[k]);
  Object.assign(row,patch); keepAdmin(ADMIN); render(); toast(okMsg);
  let r; try{ r=await post(body); }catch(e){ r={ok:false}; }
  if(r&&r.ok) return;
  Object.keys(old).forEach(k=>{ if(!/draft/i.test(k)) row[k]=old[k]; });  // 초안 칸엔 방금 쓴 글이 남는다
  keepAdmin(ADMIN); render(); toast(failMsg);
}

  let lbl, what, desc, on=-1;

  else if(ti>last){ lbl='챌린지가 끝났어요'; what='4주 동안 고생 많으셨어요'; desc='다음 스터디에서 같이 돌아봐요.'; }
  else { on=ti%7; lbl=`오늘 ${md(today)}(${GRAD.days[on]}) · ${Math.floor(ti/7)+1}주차 ${on+1}일차`; what=GRAD.stepTitle[on]; desc=GRAD.stepDesc[on]; }
  const sub=GRAD.submit[on<0?0:on];
  h+=`<div class="gd-today"><div class="l">${esc(lbl)}</div><div class="w">${esc(what)}</div><div class="d">${esc(desc)}</div>
    ${ti<=last?`<div class="sub"><b>${ti<0?'1일차에 낼 것':'오늘 낼 것'}</b>${esc(sub)}</div>`:''}
    <div class="gd-week">${GRAD.days.map((d,i)=>`<div class="${i===on?'on':''}${i===3||i===6?' u':''}"><b>${d}</b>${GRAD.steps[i]}</div>`).join('')}</div>
    <a class="btn" href="${GRAD.form}" target="_blank" rel="noopener">오늘 인증하기</a><div class="note">폼에서 팀 → 오늘 요일을 고르면 낼 칸만 나와요 · 늦게 내도 요일만 맞으면 그 칸에 찍혀요</div></div></section>`;
  // 도장판
  const passed=Math.min(ti,last+1);   // 오늘 전까지 지난 칸 수
  const board=GRAD.teams.map(t=>{
    const mine=rows.filter(r=>r.team===t), by={};
    const ids={}; mine.forEach(r=>{ const i=gdIdx(r.d); if(i<0||i>last) return; (by[i]=by[i]||[]).push(r.step); ids[i]=r.id; });
    const ups=Math.min(8, mine.filter(r=>/업로드/.test(r.step)&&gdIdx(r.d)>=0&&gdIdx(r.d)<=last).length);
    return {t,by,ids,ups,days:Object.keys(by).length};
  }).sort((a,b)=>b.ups-a.ups||b.days-a.days||GRAD.teams.indexOf(a.t)-GRAD.teams.indexOf(b.t));
  h+=`<section class="sec gd-up"><span class="eyebrow">팀별 도장판${GD?'':' · 불러오는 중…'}</span><div class="h2">업로드 많은 순</div>
    <div class="note" style="text-align:left;margin-top:6px">찍힌 도장을 누르면 그날 낸 내용이 아래에 펼쳐져요</div>
    <div class="gd-legend"><span><i style="background:var(--acc)"></i>인증</span><span><i style="background:var(--up)"></i>업로드</span><span><i style="border:1px dashed var(--acc-lt)"></i>빈 날</span></div>`;
  board.forEach(b=>{
    h+=`<div class="gd-team"><div class="top"><span class="nm">${esc(b.t)}</span><span class="ct">업로드 <b>${b.ups}</b> / 8</span></div><div class="gd-bar"><i style="width:${b.ups/8*100}%"></i></div><div class="gd-grid">`;
    for(let w=0;w<GRAD.weeks;w++){
      h+=`<span class="wk">${w+1}주</span>`;
      for(let d=0;d<7;d++){
        const i=w*7+d, st=b.by[i]; let c='gd-c';
        if(st) c+=' done'+(st.some(x=>/업로드/.test(x))?' up':'');
        else if(i<passed) c+=' miss';
        if(i===ti) c+=' now';
        h+=`<span class="${c}" title="${dayOf(i)}${st?' · '+esc(st.join(', ')):''}"${st?` onclick="gdGo(${esc(JSON.stringify(b.t))},${esc(JSON.stringify(b.ids[i]))})"`:''}>${GRAD.steps[d].slice(0,1)}</span>`;
      }
    }
    h+=`</div></div>`;
  });
  h+=`</section>`;
  // 모두의 인증 — 다른 팀이 낸 것까지 펼쳐 본다 (10/22 결영)
  const ago=v=>{ const s=(NOW()-new Date(v).getTime())/1000; return s<3600?Math.max(1,Math.round(s/60))+'분 전':s<86400?Math.round(s/3600)+'시간 전':fmtD(v); };
  const all=rows.slice().sort((a,b)=>new Date(b.at)-new Date(a.at));
  const feed=gdTeam?all.filter(r=>r.team===gdTeam):all.slice(0,30);
  h+=`<section class="sec gd-up"><span class="eyebrow">모두의 인증</span><div class="h2">다른 팀은 이렇게 했어요</div>
    <div class="gd-filter"><button class="${gdTeam?'':'on'}" onclick="gdTeam='';render()">전체</button>${GRAD.teams.map(t=>`<button class="${gdTeam===t?'on':''}" onclick="gdTeam=${esc(JSON.stringify(t))};render()">${esc(t)}</button>`).join('')}</div><div class="gd-feed">`;
  if(!feed.length) h+=`<div class="gd-empty">${gdTeam?'아직 이 팀 인증이 없어요.':ti<0?'10/22(목)부터 여기에 인증이 쌓여요.':'아직 인증이 없어요. 첫 도장을 찍어주세요.'}</div>`;
  feed.forEach(r=>{
    const i=gdIdx(r.d), wd=i>=0&&i<=last?`${Math.floor(i/7)+1}주차 ${i%7+1}일차 (${GRAD.days[i%7]})`:md(r.d);
    const img=String(r.img||'').split(' ')[0], up=/업로드/.test(r.step), F=gdFields(r.body), open=!!gdOpen[r.id];
    const more=F.length>0||!!img;
    h+=`<div class="gd-item${open?' open':''}" id="gd-${esc(r.id)}">${img?`<img class="th" src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:''}
      <div class="h"><b>${esc(r.team)}</b><span>${ago(r.at)}</span></div>
      <span class="gd-chip">${wd}</span><span class="gd-chip${up?' up':''}">${esc(r.step)}</span>
      ${r.memo?`<p>${esc(r.memo)}</p>`:''}
      ${r.link?`<a class="l" href="${esc(r.link)}" target="_blank" rel="noopener">${up?'릴스 보기':'영상 보기'} ›</a>`:''}
      ${more?`<div><button class="gd-more" onclick="gdToggle(${esc(JSON.stringify(r.id))})">${open?'접기':'전체 보기'}</button></div>
      <div class="gd-full">${F.map(f=>{ const v=f.v.trim(), url=/^https?:\/\//.test(v); const isImg=/캡처/.test(f.k);
        return `<div class="f"><b>${esc(f.k)}</b><div>${isImg?v.split(' ').map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img class="big" src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.textContent='사진 열기 ›'"></a>`).join(''):url?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v)}</div></div>`; }).join('')}
        ${!F.length&&img?`<a href="${esc(img)}" target="_blank" rel="noopener"><img class="big" src="${esc(img)}" alt=""></a>`:''}</div>`:''}</div>`;
  });
  h+=`</div>${!gdTeam&&all.length>30?'<div class="note">최근 30개까지 보여요. 팀을 누르면 그 팀 것 전부 볼 수 있어요.</div>':''}</section>`;
  // 루틴
  h+=`<section class="sec gd-up"><span class="eyebrow">일주일 루틴</span><div class="h2">하루에 한 가지만</div><div class="gd-rt" style="margin-top:14px">
    ${GRAD.stepLong.map((s,i)=>`<div class="${i===3||i===6?'u':''}"><b>${i+1}일차 ${GRAD.days[i]}</b><span>${esc(s)}<span class="s">낼 것 : ${esc(GRAD.submit[i])}</span></span></div>`).join('')}</div>
    <div class="note" style="text-align:left;margin-top:12px">1주차 10/22~10/28 · 2주차 10/29~11/4 · 3주차 11/5~11/11 · 4주차 11/12~11/18</div></section>`;
  return h;
}
function gradDemo(){
  const t=(d,team,step,memo,link)=>({id:d+team+step,at:d+'T13:00:00+09:00',d,team,step,memo:memo||'',link:link||'',img:''});
  const S=['벤치마킹·기획','촬영','편집','업로드','촬영','편집','업로드'], rows=[];
  const add=(team,pat)=>pat.split('').forEach((c,i)=>{ if(c==='1'){ const d=new Date(Date.parse('2026-10-22T00:00:00Z')+i*86400000).toISOString().slice(0,10); rows.push(t(d,team,S[i%7])); } });
  add('2기 순둥이네','1111111111'); add('3기 민퐁듀','1111101111'); add('결영이네','110111111'); add('2기 다와와','1110100101'); add('3기 꾸꾸네','00000001');
  rows.push(t('2026-10-31','3기 민퐁듀','편집','컷 편집까지 끝. 자막은 내일 아침에!'));
  rows.push(t('2026-10-29','3기 꾸꾸네','벤치마킹·기획','벤치마킹 : 월 300 직장인 / 자산 6000만원 → 20억 만들어준 8가지\n내 대본 : 외벌이 월급 300 / 순자산 10억 만들려고 한 6가지','https://www.instagram.com/reel/example'));
  rows[rows.length-1].body=['벤치마킹 릴스 링크 : https://www.instagram.com/reel/example','벤치마킹 첫 문장 : 월 300 직장인 / 자산 6000만원 → 20억 만들어준 8가지','벤치마킹 첫 장면 : 밤 책상, 키보드 치는 손. 큰 글자 6000만원 → 20억','벤치마킹 뒤 흐름 : 제목 고정','8가지를 2개씩 4화면','내 대본 첫 문장 : 외벌이 월급 300 / 순자산 10억 만들려고 한 6가지','내 대본 첫 장면 : 아기 사진, 큰 글자 빚 3천 → 순자산 10억','내 대본 흐름 : 1. 절약 · 통신비 월 3만 원대','2. 절세 · 부부 각자 ISA','3. 부수입 · 통장 하나 더'].join('\n');
  return {ok:true,rows,_demo:true};
}

// 알림톡 버튼은 ?go=grad 처럼 들어온다 (카카오 버튼 주소에 #을 변수로 못 넣어서) → 그 탭으로
(()=>{ const g=new URLSearchParams(location.search).get('go'); if(g && /^[a-z]+$/.test(g) && !location.hash) history.replaceState(null,'',location.pathname+'#'+g); })();
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
// 운영진 창을 열어둔 채 다른 데 갔다 오면 새 초안·과제를 다시 받는다 (10/27 결영: 올린 초안이 안 보임)
//   1분 안에 받았거나, 고쳐 쓰던 글이 있으면 건너뛴다 (다시 그리면 쓴 글이 지워져서)
let lastLoad=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden || !ADMIN || Date.now()-lastLoad<60000) return;
  if([...document.querySelectorAll('#view textarea, #view input')].some(t=>t.value!==t.defaultValue)) return;
  lastLoad=Date.now(); load();
});
tick(); setInterval(tick,1000);
// 서버 설정(명단·폼·책·주차)을 먼저 받는다. 실패해도 위의 기본값으로 뜬다
async function loadCfg(){
  try{
    const c = await rpc({action:'cfg'});
    if(!c || !c.ok) return;
    if(Array.isArray(c.roster) && c.roster.length){ ROSTER = c.roster; LOGIN_NAMES = ROSTER; }
    if(Array.isArray(c.real)) REAL = c.real;
    const g = c.config || {};
    if(g.form) FORM = g.form.startsWith('http') ? g.form : 'https://tally.so/r/' + g.form;
    if(g.sns_form){ SNS_FORM = g.sns_form.startsWith('http') ? g.sns_form : 'https://tally.so/r/' + g.sns_form; if(TASKS.sns && TASKS.sns[1] && TASKS.sns[1].submit) TASKS.sns[1].submit.url = SNS_FORM; }
    if(g.book) BOOK = g.book;
    if(g.banner) BANNER_FILE = g.banner;
    if(g.ot) OT = g.ot;
    if(Array.isArray(g.weeks) && g.weeks.length) WEEKS = g.weeks;
  }catch(e){}
}
(()=>{ const t='원팀 프로젝트 '+COHORT+'기 · 과제방'; document.title=t; const nv=document.querySelector('a[data-v="home"]'); if(nv) nv.textContent=COHORT+'기';
  document.querySelectorAll('footer').forEach(f=>{ f.innerHTML=f.innerHTML.replace(/원팀 프로젝트 \d+기/,'원팀 프로젝트 '+COHORT+'기'); });
  document.querySelectorAll('footer a[href="../5/"]').forEach(a=>{ a.href='../'+(COHORT-1)+'/'; a.textContent=(COHORT-1)+'기 과제방'; }); })();
(async()=>{ warm(); await loadCfg(); render(); load(); pullChecks(); })();
