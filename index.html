<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>원팀 프로젝트 5기 · 과제방</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* 5기 상세페이지와 같은 팔레트 — 흰 바탕에 네이비 하나 */
  --bg:#F7F8FA; --white:#FFF; --dark:#1C2B4A;
  --acc:#1B2A4E; --acc-soft:#EEF1F7; --acc-lt:#B9C8E2;
  --acc2:#2F3A4A; --acc2-soft:#EDEFF3;
  --text:#14181F; --text-md:#5A6172; --text-lt:#6B7280; --mute:#9AA0AC;
  --border:#E6E8EE; --warn:#854F0B; --warn-bg:#FBF6EC; --warn-line:#EAD9B5;
  --miss:#791F1F; --miss-bg:#FCEBEB;
}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--text);line-height:1.6;background:var(--bg);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh}
a{color:inherit}
button{font-family:inherit}

/* 맨 위 고정: 마감 타이머 + 메뉴 */
.top{position:sticky;top:0;z-index:20}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--dark);color:#fff;padding:11px 20px 10px}
.timer .l{font-size:12px;color:var(--acc-lt);line-height:1.45}
.timer .l b{display:block;color:#fff;font-weight:600;font-size:12.5px}
.timer .c{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer .c small{font-size:11px;font-weight:500;color:var(--acc-lt);margin:0 3px 0 1px}
.timer.urgent .c{color:#F4C0D1}
.menu{display:flex;gap:2px;overflow-x:auto;padding:0 10px;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.menu::-webkit-scrollbar{display:none}
.menu a{flex-shrink:0;text-decoration:none;font-size:14px;font-weight:600;color:var(--text-lt);padding:12px 10px 10px;border-bottom:2.5px solid transparent}
.menu a.on{color:var(--acc);border-bottom-color:var(--acc)}

.sec{padding:32px 22px;background:var(--white)}
.sec-alt{padding:32px 22px;background:var(--bg)}
.sec-dark{padding:32px 22px 30px;background:var(--dark);color:#fff}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--acc);display:block;margin-bottom:8px}
.sec-dark .eyebrow{color:var(--acc-lt)}
.h1{font-size:25px;font-weight:700;line-height:1.4;letter-spacing:-.035em}
.h2{font-size:21px;font-weight:700;line-height:1.42;letter-spacing:-.032em}
.body1{font-size:14px;line-height:1.75;color:var(--text-md);margin-top:7px}
.sec-dark .body1{color:rgba(255,255,255,.7)}
.hl{color:var(--acc)}
.lb{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:5px}
.lb.g{color:var(--acc2);background:var(--acc2-soft)}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px 15px;margin-top:10px}
.nm{font-size:16.5px;font-weight:700;margin-top:6px;letter-spacing:-.03em;line-height:1.4}
.ds{font-size:13px;color:var(--text-md);margin-top:3px;line-height:1.6}
.or-line{border-top:1px dashed var(--border);margin:14px 0 2px}
.btns{display:flex;gap:6px;margin-top:12px}
.b{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;padding:10px 6px;border-radius:9px;border:1px solid var(--acc);color:var(--acc);background:#fff;text-decoration:none;cursor:pointer;text-align:center;line-height:1.3}
.b.fill{background:var(--acc);color:#fff}
.b.off{border-color:var(--border);color:var(--mute);background:var(--bg);cursor:default}
.btn{display:block;text-align:center;background:var(--acc);color:#fff;font-size:16px;font-weight:600;padding:17px;border-radius:12px;text-decoration:none;margin-top:20px}
.note{text-align:center;font-size:12px;color:var(--text-lt);margin-top:10px}

/* 과제 예시 (펼침) */
.ex{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.ex.open{display:block}
.ex h4{font-size:12.5px;font-weight:700;color:var(--acc);margin:12px 0 6px}
.ex h4:first-child{margin-top:0}
.ex ol{padding-left:18px;font-size:13px;color:var(--text-md);line-height:1.75}
.ex pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.75;background:var(--bg);border-radius:10px;padding:12px 13px;color:var(--text)}
.ex .copy{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border:0;border-radius:7px;padding:5px 10px;cursor:pointer}
.ex .warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.6}
.ex .tbd{font-size:12px;color:var(--mute);margin-top:8px}

/* 과정별 주차 줄 */
.wrow{padding:16px 0;border-top:1px solid var(--border)}
.wrow:last-child{border-bottom:1px solid var(--border)}
.wrow .w{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-lt)}
.wrow .w b{color:var(--acc)}
.wrow .t{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:-.03em}
.wrow.lock .t,.wrow.lock .w b{color:var(--mute)}

/* MVP */
.mvp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px 17px;margin-top:12px}
.mvp .who{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--acc-lt)}
.mvp .tag{font-size:11px;font-weight:700;color:var(--dark);background:var(--acc-lt);padding:2px 8px;border-radius:5px;white-space:nowrap}
.mvp .tt{font-size:16.5px;font-weight:700;margin-top:7px;letter-spacing:-.03em}
.mvp .qt{font-size:14px;line-height:1.8;color:rgba(255,255,255,.85);margin-top:6px}
.mvp .full{display:none;white-space:pre-wrap;font-size:13.5px;line-height:1.8;color:rgba(255,255,255,.78);margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.mvp.open .full{display:block}
.mvp .rd{background:none;border:0;font-size:13px;font-weight:600;color:var(--acc-lt);margin-top:10px;cursor:pointer;padding:0}
.mvp .rd a{color:var(--acc-lt)}
.mvp-empty{font-size:14px;line-height:1.75;color:rgba(255,255,255,.7);margin-top:10px}

/* 부부 진행판 */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.stats div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center}
.stats b{display:block;font-size:23px;font-weight:700;color:var(--acc);letter-spacing:-.04em;line-height:1.25}
.stats span{font-size:11.5px;color:var(--text-lt)}
.seg{display:inline-flex;background:var(--acc2-soft);border-radius:9px;padding:3px;margin-top:18px}
.seg button{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--text-lt);padding:6px 13px;border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cp{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);font-size:14.5px}
.cp:last-child{border-bottom:1px solid var(--border)}
.cp .n{width:118px;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.cp .n span.nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .tr{font-size:10.5px;font-weight:700;color:var(--acc2);background:var(--acc2-soft);padding:1px 6px;border-radius:4px;flex-shrink:0}
.cp .bar{flex:1;height:7px;background:var(--acc-soft);border-radius:4px;overflow:hidden}
.cp .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.cp .v{width:38px;text-align:right;font-size:13px;color:var(--text-md);font-variant-numeric:tabular-nums}
.cp.done .v{color:var(--acc);font-weight:700}
.cp.click{cursor:pointer}
.more{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:12px 0;font-size:13.5px;font-weight:600;color:var(--acc);cursor:pointer}

/* Q&A */
.qa{background:var(--bg);border-radius:12px;padding:15px 16px;margin-top:10px}
.sec-alt .qa{background:#fff;border:1px solid var(--border)}
.qa .qt{font-size:14.5px;font-weight:600;line-height:1.6}
.qa .qt::before{content:"Q. ";color:var(--acc);font-weight:800}
.qa .at{font-size:13.5px;color:var(--text-md);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);line-height:1.7;white-space:pre-wrap}
.qa .at.wait{color:var(--mute)}
.qa .meta{font-size:11.5px;color:var(--text-lt);margin-top:5px}
.empty{font-size:14px;color:var(--text-lt);padding:22px 0;text-align:center}

/* 결영님 화면 */
.admin{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:16px;margin-top:4px}
.admin h3{font-size:15px;font-weight:700;color:var(--warn);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.admin h3 button{font-size:11.5px;font-weight:600;color:var(--warn);background:none;border:1px solid var(--warn-line);border-radius:6px;padding:3px 8px;cursor:pointer}
.admin .sub{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--text)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin:3px 4px 0 0;background:var(--miss-bg);color:var(--miss)}
.chip.ok{background:var(--acc-soft);color:var(--acc)}
.aq{background:#fff;border:1px solid var(--warn-line);border-radius:10px;padding:11px 12px;margin-top:8px;font-size:13px}
.aq .m{font-size:11.5px;color:var(--text-lt)}
.aq textarea,.aq input,.admin input,.admin select{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;padding:8px 9px;margin-top:6px;background:#fff}
.aq textarea{min-height:64px;resize:vertical}
.row2{display:flex;gap:6px;margin-top:6px;align-items:center}
.row2 select{width:auto;margin-top:0}
.sbtn{font-size:12.5px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.sbtn.ghost{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.saved{font-size:12px;color:var(--acc);margin-left:4px}
.detail{background:var(--bg);border-radius:10px;padding:10px 12px;margin:2px 0 8px;font-size:13px}
.detail .it{padding:8px 0;border-top:1px solid var(--border)}
.detail .it:first-child{border-top:0}
.detail .it b{font-weight:700}
.detail .it .m{font-size:11.5px;color:var(--text-lt)}
.detail .it pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;color:var(--text-md);margin-top:4px;line-height:1.65}
.detail .it a{color:var(--acc);font-size:12px;font-weight:600}

.state{padding:40px 22px;text-align:center;color:var(--text-lt);font-size:14px}
footer{padding:28px 22px 40px;text-align:center;font-size:12px;color:var(--text-lt);background:var(--bg)}
footer a{color:var(--text-lt);margin:0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
</style>
</head>

    <nav class="menu" id="menu">

<script>

// 과정: live = 라이브 요일 (없으면 null). 독서·돈관리는 모두, 내집마련·SNS는 택1

  money:{
    1:{name:'자산 점검',
      how:['모아불리 가계부에 우리 부부 자산과 부채를 항목별로 채우기','수입(월급 실수령·성과급·부업) / 현금성(파킹통장·예적금·청약) / 주식 / 부동산(시세·보증금, 대출) / 연금·보험(해약환급금·퇴직연금)','합쳐서 순자산 보고, 올해 목표와 10년 뒤 목표 적기'],

    2:{name:'고정·변동비 점검',

// 시험용: window.__NOW 에 시각을 넣으면 그날 화면이 뜬다
const NOW = () => window.__NOW || Date.now();
const kst = (d, end) => new Date(d + (end ? 'T23:59:59' : 'T00:00:00') + '+09:00').getTime();
function curWeek(now){ let c=0; WEEKS.forEach(w=>{ if(now>=kst(w.open)) c=w.n; }); return c; }
function nextDue(now){ return WEEKS.find(w=>now<=kst(w.due,true)); }
const W = n => WEEKS[n-1];

// 마감 타이머 — 1초마다. 마감이 지나면 다음 주차 마감으로 넘어간다
function tick(){
  const now=NOW(), w=nextDue(now), tl=document.getElementById('tl'), tc=document.getElementById('tc');
  const box=document.getElementById('timer');
  if(!w){ tl.innerHTML='<b>5기 과제가 모두 끝났어요</b>수고 많으셨어요'; tc.textContent=''; return; }
  const [,m,d]=w.due.split('-').map(Number);
  tl.innerHTML=`${w.n}주차 과제 마감까지<b>${m}/${d}(월) 23:59</b>`;
  let s=Math.max(0,Math.floor((kst(w.due,true)-now)/1000));
  const dd=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const mi=Math.floor(s/60); s%=60;
  const p=n=>String(n).padStart(2,'0');
  tc.innerHTML=(dd?`${dd}<small>일</small>`:'')+`${p(h)}<small>:</small>${p(mi)}<small>:</small>${p(s)}`;
  box.classList.toggle('urgent', dd===0);
}

let DATA=null, ADMIN=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// "2주차 - 내집마련 (우리 집 월 상환선)" → {week:2, track:'house'}
function parseTask(t){ const m=String(t||'').match(/^(\d)\s*주차\s*-\s*(\S+)/); return m?{week:+m[1], track:TRACK_OF[m[2]]}:null; }
function fmtD(v){ const d=new Date(v); return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()}`; }
function getKey(){ try{return sessionStorage.getItem('ot5key')||'';}catch(e){return '';} }
function setKey(k){ try{ k?sessionStorage.setItem('ot5key',k):sessionStorage.removeItem('ot5key'); }catch(e){} }

async function load(){
  if(new URLSearchParams(location.search).has('demo')){ DATA=demoData(); ADMIN=getKey()?demoAdmin():null; return render(); }
  if(!API){ DATA={subs:[],mvp:[],qa:[],links:{}}; return render(); }
  try{
    const r=await fetch(API+'?t='+Date.now()); DATA=await r.json();
    const k=getKey();
    if(k){ const a=await (await fetch(API+'?action=admin&key='+encodeURIComponent(k)+'&t='+Date.now())).json(); if(a.ok){ADMIN=a; DATA=a;} else { setKey(''); ADMIN=null; } }
  }catch(e){ DATA=null; }
  render();
}
async function post(body){
  if(!API) return {ok:true};
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:getKey()},body))});
  return r.json();
}

// 부부 하나의 주차별 완료 {read,money,pick,track} — 택1은 내집·SNS 중 하나만 내도 완료
function progress(h, week){
  const mine=(DATA.subs||[]).filter(s=>s.h===h).map(s=>parseTask(s.task)).filter(Boolean).filter(t=>t.week===week);
  const has=k=>mine.some(t=>t.track===k);
  return {read:has('read'), money:has('money'), house:has('house'), sns:has('sns'), get pick(){return this.house||this.sns;},
    get done(){return (this.read?1:0)+(this.money?1:0)+(this.pick?1:0);}};
}
function choiceOf(h){
  let hs=0, sn=0;
  (DATA.subs||[]).filter(s=>s.h===h).forEach(s=>{const t=parseTask(s.task); if(!t)return; if(t.track==='house')hs++; if(t.track==='sns')sn++;});
  return hs&&sn?'둘 다':hs?'내집':sn?'SNS':'';
}

let view='home', boardMode='week', boardAll=false, openDetail=null;
function render(){
  const v=(location.hash||'#home').slice(1);
  view=['home','week','read','money','house','sns','qa'].includes(v)?v:'home';
  document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  const el=document.getElementById('view');
  if(!DATA){ el.innerHTML='<div class="state">과제 정보를 불러오지 못했어요.<br>잠시 뒤에 새로고침해 주세요.</div>'; return; }
  el.innerHTML = view==='home'?homeView() : view==='week'?weekView() : view==='qa'?qaView() : trackView(view);
}

// 5기 (첫 화면): MVP → 부부 진행판
function homeView(){
  const now=NOW(), cw=curWeek(now);
  let h='';
  if(ADMIN) h+=`<div class="sec" style="padding-bottom:6px">${adminPanel(cw)}</div>`;
  // MVP
  const mv=(DATA.mvp||[]);
  h+=`<section class="sec-dark"><span class="eyebrow">★ 지난주 MVP</span><div class="h2">이번 주에 제일 잘한 과제</div>`;
  if(!mv.length) h+=`<div class="mvp-empty">첫 MVP는 1주차 마감(10/19) 뒤에 여기에 올라와요.<br>과제를 낼 때 공유 동의를 O로 해 주시면 MVP 후보가 돼요.</div>`;
  mv.forEach((m,i)=>{
    const t=parseTask(m.task), tn=t?TRACKS[t.track].name:'과제', task=t&&TASKS[t.track][t.week]?TASKS[t.track][t.week].name:m.task;
    const quote=m.quote||String(m.body||'').split('\n').filter(Boolean).slice(0,2).join(' ');
    h+=`<div class="mvp" id="mvp${i}"><div class="who"><span class="tag">${t?t.week+'주차 · ':''}${esc(tn)}</span><span>${esc(m.h)}${m.who?' · '+esc(m.who):''}</span></div>
      <div class="tt">${esc(task)}</div><div class="qt">"${esc(quote)}"</div>
      <div class="full">${esc(m.body)}${m.link?`\n\n<a href="${esc(m.link)}" target="_blank" rel="noopener" style="color:var(--acc-lt)">게시물 보기 ›</a>`:''}</div>
      <button class="rd" onclick="this.parentNode.classList.toggle('open');this.textContent=this.parentNode.classList.contains('open')?'접기 ▴':'전체 읽기 ▾'">전체 읽기 ▾</button></div>`;
  });
  h+=`</section>`;
  // 진행판
  h+=`<section class="sec">${board(cw)}<a class="btn" href="${FORM}" target="_blank" rel="noopener">과제 제출하기</a><div class="note">과제 하나에 한 번씩 · 금액은 가려도 돼요</div></section>`;
  return h;
}

function board(cw){
  const n=ROSTER.length;
  if(!cw){
    return `<span class="eyebrow">5기 ${n}부부</span><div class="h2">1주차는 <span class="hl">10월 13일</span>에 시작해요</div>
      <div class="body1">OT 주는 과제가 없어요. 『부의 인문학』만 준비해 두세요.</div>
      <div style="margin-top:14px">${ROSTER.map(r=>`<div class="cp"><span class="n"><span class="nn">${esc(r)}</span></span><span class="bar"><i style="width:0"></i></span><span class="v">0/3</span></div>`).join('')}</div>`;
  }
  // 이번 주 / 전체
  const rows=ROSTER.map(r=>{
    if(boardMode==='week'){ const p=progress(r,cw); return {h:r,done:p.done,total:3}; }
    let d=0; for(let w=1;w<=cw;w++) d+=progress(r,w).done; return {h:r,done:d,total:cw*3};
  }).sort((a,b)=>b.done-a.done||ROSTER.indexOf(a.h)-ROSTER.indexOf(b.h));
  const wk=ROSTER.map(r=>progress(r,cw));
  const sum=wk.reduce((a,p)=>a+p.done,0), full=wk.filter(p=>p.done===3).length;
  const hs=wk.filter(p=>p.house).length, sn=wk.filter(p=>p.sns).length;
  const shown=boardAll?rows:rows.slice(0,8);
  let h=`<span class="eyebrow">5기 ${n}부부</span><div class="h2">${cw}주차, <span class="hl">다들 여기까지</span> 왔어요</div>
    <div class="stats"><div><b>${Math.round(sum/(n*3)*100)}%</b><span>이번 주 달성</span></div><div><b>${full}</b><span>다 한 부부</span></div><div><b>${hs} · ${sn}</b><span>내집 · SNS</span></div></div>
    <div class="seg"><button class="${boardMode==='week'?'on':''}" onclick="boardMode='week';render()">이번 주</button><button class="${boardMode==='all'?'on':''}" onclick="boardMode='all';render()">${cw>1?'1~'+cw+'주 전체':'전체'}</button></div>
    <div style="margin-top:12px">`;
  shown.forEach(r=>{
    const c=choiceOf(r.h), w=r.total?Math.round(r.done/r.total*100):0;
    h+=`<div class="cp${r.done===r.total?' done':''}${ADMIN?' click':''}" ${ADMIN?`onclick="openDetail=openDetail===${JSON.stringify(r.h).replace(/"/g,'&quot;')}?null:${JSON.stringify(r.h).replace(/"/g,'&quot;')};render()"`:''}>
      <span class="n"><span class="nn">${esc(r.h)}</span>${c?`<span class="tr">${c}</span>`:''}</span>
      <span class="bar"><i style="width:${w}%"></i></span><span class="v">${r.done}/${r.total}</span></div>`;
    if(ADMIN && openDetail===r.h) h+=detailOf(r.h);
  });
  if(rows.length>8) h+=`<button class="more" onclick="boardAll=!boardAll;render()">${boardAll?'접기 ▴':`${n}부부 모두 보기 ▾`}</button>`;
  return h+`</div>`;
}

// 이번 주 화면
function weekView(){
  const now=NOW(), cw=curWeek(now);
  if(!cw){
    return `<section class="sec"><span class="eyebrow">OT 주 · 10/6 ~ 10/12</span><div class="h1">이번 주는<br><span class="hl">과제가 없어요</span></div>
      <div class="body1">『부의 인문학』만 준비해 두세요. 1주차 과제는 10월 13일(화)에 열려요.</div></section>`+weekCards(1,true);
  }
  const w=W(cw), [,m,d]=w.due.split('-').map(Number);
  return `<section class="sec" style="padding-bottom:0"><span class="eyebrow">${cw}주차 · 마감 ${m}/${d}(월) 23:59</span>
    <div class="h1">이번 주엔 <span class="hl">세 가지</span>만<br>하면 돼요</div>
    <div class="body1">독서·돈관리는 모두, 내집마련·SNS는 하나만 골라요.<br>바쁜 주엔 회고 한 줄만 남겨도 인증돼요.</div></section>`+weekCards(cw,false);
}
function weekCards(n,preview){
  let h=`<section class="sec" style="padding-top:${preview?'0':'14px'}">`;
  if(preview) h+=`<span class="eyebrow">미리 보기 · 1주차</span>`;
  h+=taskCard('read',n,'독서 · 필수')+taskCard('money',n,'돈관리 · 필수');
  h+=`<div class="card"><span class="lb g">둘 중 하나만 골라요</span>${taskInner('house',n)}<div class="or-line"></div>${taskInner('sns',n)}</div>`;
  h+=`<a class="btn" href="${FORM}" target="_blank" rel="noopener">과제 제출하기</a><div class="note">과제 하나에 한 번씩 · 금액은 가려도 돼요</div></section>`;
  return h;
}
function taskCard(k,n,label){ return `<div class="card"><span class="lb">${label}</span>${taskInner(k,n)}</div>`; }
function taskInner(k,n){
  const t=TASKS[k][n], tr=TRACKS[k], id=`ex-${k}-${n}`;
  const nm = TRACKS[k].must ? t.name : `${tr.name} · ${t.name}`;
  return `<div class="nm">${esc(nm)}</div>${buttons(k,n,id)}${example(k,n,id)}`;
}
function buttons(k,n,id){
  const tr=TRACKS[k], w=W(n), now=NOW();
  let live='';
  if(tr.live){
    const day=tr.live==='화'?w.tue:w.thu, url=(DATA.links||{})[n+'|'+tr.name];
    live = url ? `<a class="b" href="${esc(url)}" target="_blank" rel="noopener">▶ ${tr.live} ${day} 라이브</a>`
               : `<span class="b off">${tr.live} ${day} 라이브 · ${now<kst(w.open)?'예정':'링크 준비 중'}</span>`;
  }
  return `<div class="btns"><button class="b fill" onclick="toggleEx('${id}',this)">과제 예시 ▾</button>${live}</div>`;
}
function example(k,n,id){
  const t=TASKS[k][n];
  let h=`<div class="ex" id="${id}"><h4>이렇게 하세요</h4><ol>${t.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <h4>제출 양식 — 복사해서 탈리에 붙여넣기</h4><pre>${esc(t.form)}</pre><button class="copy" onclick="copyForm(this)">양식 복사</button>`;
  if(t.ex) h+=`<h4>결영이네 예시</h4><pre>${esc(t.ex)}</pre>`;
  if(t.warn) h+=`<div class="warn">⚠️ ${esc(t.warn)}</div>`;
  if(t.tbd) h+=`<div class="tbd">SNS 과제는 목요일 라이브 내용에 맞춰 바뀔 수 있어요.</div>`;
  return h+`</div>`;
}
function toggleEx(id,btn){ const e=document.getElementById(id); e.classList.toggle('open'); btn.textContent=e.classList.contains('open')?'과제 예시 ▴':'과제 예시 ▾'; }
function copyForm(btn){
  const txt=btn.previousElementSibling.textContent;
  const done=()=>toast('양식을 복사했어요. 탈리 "과제 내용"에 붙여넣으세요');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){ const a=document.createElement('textarea'); a.value=txt; document.body.appendChild(a); a.select(); try{document.execCommand('copy');done();}catch(e){} a.remove(); }

// 과정별 화면 (독서·돈관리·내집마련·SNS)
function trackView(k){
  const tr=TRACKS[k], now=NOW(), cw=curWeek(now);
  let h=`<section class="sec"><span class="eyebrow">과정별 바로가기</span><div class="h1">${tr.name}</div><div class="body1">${tr.desc}</div><div style="margin-top:18px">`;
  WEEKS.forEach(w=>{
    const t=TASKS[k][w.n], id=`exT-${k}-${w.n}`, open=now>=kst(w.open), isCur=w.n===cw, [,m,d]=w.due.split('-').map(Number);
    const state=isCur?'지금 진행 중':open?'지난 주차 · 늦게 내도 돼요':`${fmtD(kst(w.open))}에 열려요`;
    h+=`<div class="wrow${open?'':' lock'}"><div class="w"><b>${w.n}주차</b><span>${state} · 마감 ${m}/${d}</span></div>
      <div class="t">${esc(t.name)}</div>${buttons(k,w.n,id)}${example(k,w.n,id)}</div>`;
  });
  return h+`</div><a class="btn" href="${FORM}" target="_blank" rel="noopener">과제 제출하기</a></section>`;
}

// Q&A
function qaView(){
  const list=DATA.qa||[];
  let h=`<section class="sec-alt"><span class="eyebrow">Q&amp;A</span><div class="h1">물어봐 주신 것들</div>
    <div class="body1">과제를 낼 때 탈리 맨 아래 칸에 질문을 남겨주세요. 답은 닉네임 없이 여기 올라와요.</div>`;
  if(!list.length) h+=`<div class="empty">아직 올라온 질문이 없어요</div>`;
  list.forEach(q=>{
    const t=parseTask(q.task), tag=t?`${t.week}주차 ${TRACKS[t.track].name}`:'';
    h+=`<div class="qa"><div class="qt">${esc(q.q)}</div>${q.a?`<div class="at">${esc(q.a)}</div>`:`<div class="at wait">답변을 준비하고 있어요</div>`}
      <div class="meta">${esc(tag)}${q.by?' · '+esc(q.by):''}</div></div>`;
  });
  return h+`</section>`;
}

function adminPanel(cw){
  const rows=ADMIN.rows||[], wk=cw||1;
  const zero=ROSTER.filter(r=>progress(r,wk).done===0);
  const part=ROSTER.filter(r=>{const d=progress(r,wk).done; return d>0&&d<3;});
  const unans=rows.filter(r=>r.q && !r.answer);
  const cand=rows.filter(r=>r.shareOk && !r.isMvp).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,12);
  let h=`<div class="admin"><h3>🔒 결영님만 보여요 <button onclick="logout()">나가기</button></h3>
    <div class="sub">${wk}주차 하나도 안 낸 부부 · ${zero.length}</div>${zero.map(r=>`<span class="chip">${esc(r)}</span>`).join('')||'<span class="chip ok">없어요</span>'}
    <div class="sub">${wk}주차 덜 낸 부부 · ${part.length}</div>${part.map(r=>`<span class="chip" style="background:#FAEEDA;color:#633806">${esc(r)} ${progress(r,wk).done}/3</span>`).join('')||'<span class="chip ok">없어요</span>'}
    <div class="sub">답 안 단 질문 · ${unans.length}</div>`;
  unans.forEach(r=>{ h+=`<div class="aq"><div class="m">${esc(r.h)} · ${esc(r.task)} · ${fmtD(r.at)}</div><div style="margin-top:4px">${esc(r.q)}</div>
    <textarea id="ans-${esc(r.id)}" placeholder="답변을 쓰면 Q&A에 닉네임 없이 올라가요"></textarea>
    <div class="row2"><select id="by-${esc(r.id)}"><option>머니그랩</option><option>결영</option></select><button class="sbtn" onclick="saveAnswer('${esc(r.id)}',this)">저장</button></div></div>`; });
  h+=`<div class="sub">MVP 후보 (공유 동의 O) · ${cand.length}</div>`;
  if(!cand.length) h+=`<div style="font-size:12.5px;color:var(--text-lt)">아직 없어요</div>`;
  cand.forEach(r=>{ h+=`<div class="aq"><div class="m">${esc(r.h)} · ${esc(r.task)} · ${fmtD(r.at)}</div><pre style="white-space:pre-wrap;font-family:inherit;margin-top:4px;color:var(--text-md)">${esc(String(r.body).slice(0,220))}${String(r.body).length>220?'…':''}</pre>
    <input id="q-${esc(r.id)}" placeholder="소개 문구 (비우면 첫 두 줄)"><div class="row2"><button class="sbtn" onclick="setMvp('${esc(r.id)}',this)">★ MVP로 올리기</button></div></div>`; });
  const cur=rows.filter(r=>r.isMvp);
  if(cur.length){ h+=`<div class="sub">지금 올라간 MVP</div>`; cur.forEach(r=>{ h+=`<div class="aq"><div class="m">${esc(r.h)} · ${esc(r.task)}</div><div class="row2"><button class="sbtn ghost" onclick="unMvp('${esc(r.id)}',this)">내리기</button></div></div>`; }); }
  h+=`<div class="sub">라이브 다시보기 링크</div><div class="row2"><select id="lkW">${WEEKS.map(w=>`<option value="${w.n}" ${w.n===wk?'selected':''}>${w.n}주차</option>`).join('')}</select><select id="lkT"><option>내집마련</option><option>SNS</option></select></div>
    <input id="lkU" placeholder="https://youtu.be/..."><div class="row2"><button class="sbtn" onclick="saveLink(this)">링크 저장</button></div>
    <div style="font-size:12px;color:var(--text-lt);margin-top:10px">부부 이름을 누르면 낸 과제 내용이 펼쳐져요.</div></div>`;
  return h;
}
function detailOf(h){
  const rows=(ADMIN.rows||[]).filter(r=>r.h===h).sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(!rows.length) return `<div class="detail"><div class="it">아직 낸 과제가 없어요</div></div>`;
  return `<div class="detail">${rows.map(r=>`<div class="it"><b>${esc(r.task)}</b> <span class="m">${esc(r.who)} · ${fmtD(r.at)} · 공유 ${r.shareOk?'O':'X'}</span>
    <pre>${esc(r.body)}</pre>
    ${r.file?String(r.file).split(/[\s,]+/).filter(u=>/^https?:/.test(u)).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">캡처 ${i+1} ›</a> `).join(''):''}
    ${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">SNS 링크 ›</a>`:''}
    ${r.q?`<pre><b>질문</b> ${esc(r.q)}${r.answer?`\n<b>답</b> ${esc(r.answer)}`:''}</pre>`:''}</div>`).join('')}</div>`;
}
async function saveAnswer(id,btn){
  const text=document.getElementById('ans-'+id).value.trim(); if(!text) return toast('답변을 먼저 써 주세요');
  btn.disabled=true; const r=await post({op:'answer',id,text,who:document.getElementById('by-'+id).value}); btn.disabled=false;
  r.ok?(toast('답변을 저장했어요'),load()):toast('저장하지 못했어요. 다시 해 주세요');
}
async function setMvp(id,btn){ btn.disabled=true; const r=await post({op:'mvp',id,quote:document.getElementById('q-'+id).value.trim()}); r.ok?(toast('MVP로 올렸어요'),load()):(btn.disabled=false,toast('저장하지 못했어요')); }
async function unMvp(id,btn){ btn.disabled=true; const r=await post({op:'unmvp',id}); r.ok?(toast('MVP에서 내렸어요'),load()):(btn.disabled=false,toast('저장하지 못했어요')); }
async function saveLink(btn){
  const url=document.getElementById('lkU').value.trim(); if(!/^https?:\/\//.test(url)) return toast('https:// 로 시작하는 주소를 넣어 주세요');
  btn.disabled=true; const r=await post({op:'link',week:+document.getElementById('lkW').value,track:document.getElementById('lkT').value,url}); btn.disabled=false;
  r.ok?(toast('링크를 저장했어요'),load()):toast('저장하지 못했어요');
}
function logout(){ setKey(''); ADMIN=null; openDetail=null; load(); }
document.getElementById('adminLink').addEventListener('click',async e=>{
  e.preventDefault();
  if(ADMIN){ location.hash='#home'; return; }
  const k=prompt('운영진 비밀번호'); if(!k) return;
  setKey(k.trim()); await load();
  if(!ADMIN){ toast('비밀번호가 맞지 않아요'); } else { location.hash='#home'; window.scrollTo(0,0); }
});

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

function demoData(){
  const T=(w,k)=>`${w}주차 - ${TRACKS[k].name} (${TASKS[k][w].name})`;
  const subs=[]; let id=0;
  const add=(h,w,k,who,body,share,q,qOk)=>subs.push({id:'d'+(++id),h,task:T(w,k),at:new Date(kst(W(w).open)+86400000*(1+id%4)).toISOString(),who,body:body||TASKS[k][w].ex||TASKS[k][w].form,shareOk:share!==false,q:q||'',qOk:!!qOk,file:'',link:k==='sns'?'https://www.threads.net/@example':''});
  ['라부부','송파부부','오유부부','용영','희찬부부'].forEach((h,i)=>{ add(h,1,'read','아내'); add(h,1,'money','남편'); add(h,1,i%2?'sns':'house','아내'); });
