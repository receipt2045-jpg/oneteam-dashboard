<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원팀 프로젝트 과제방</title>
<meta property="og:title" content="원팀 프로젝트 · 과제방">
<script>
// 첫 주소(is.gd/oneteamcheck)는 지금 진행 중인 기수로 보낸다 (11/16~ 6기)
// 5기 알림의 ?go=grad·졸업반·지난 기수(?term=) 링크는 5기 과제방으로
(function(){
  var NOW_COHORT = '6';
  var q = location.search, h = location.hash;
  // 졸업반 스터디방 (11/17~): #study · ?go=study
  if (/^#study/.test(h) || /[?&]go=study/.test(q)) { location.replace('study/'); return; }
  if (/^#challenge/.test(h) || /[?&]go=challenge/.test(q)) { location.replace('study/#challenge'); return; }
  var to5 = /[?&](go|term)=/.test(q) || /^#grad/.test(h);
  location.replace((to5 ? '5/' : NOW_COHORT + '/') + q + h);
})();
</script>
</head><body style="font-family:sans-serif;padding:24px">
<p>과제방으로 이동하는 중이에요… <a href="6/">6기 과제방</a> · <a href="5/">5기 과제방</a></p>
</body></html>
